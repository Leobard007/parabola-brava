<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parábola Brava</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Kalam:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Layout: menús sobre un plano de ingeniería animado; el juego en un cuaderno de laboratorio (papel milimetrado) con pistas, mandos o mesa de diseño debajo */
:root{
  --bg:#d9e4dc; --panel:#f4f8f3; --paper:#edf4ee; --grid:#d3e3d6; --grid-major:#a9c8b2;
  --ink:#1c2a48; --ink-soft:#56657f; --line:#b8cdbe;
  --pencil:#d4483b; --pencil-deep:#a5302a; --vector:#2f5fb3; --mixed:#7a4bb0;
  --wood:#d1934f; --wood-dark:#8f5a26; --stone:#9aa3b2; --stone-dark:#5f6878;
  --target:#93c23e; --target-dark:#4f7a17; --earth:#86705a; --earth-dark:#5b4836;
  --ok-bg:#e2efd6; --inc-bg:#dce6f7;
  --bp:#10213d; --bp-line:#a8c2ee; --bp-text:#e8f0ff; --bp-soft:#b3c6e6; --gold:#ffd166;
  --f-display:'Lilita One','Trebuchet MS',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --f-hand:'Kalam','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
body.menu{background:var(--bp)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
body.menu button:focus-visible{outline-color:var(--gold)}

/* ---- menús ---- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
.menuScreen{position:relative;z-index:1;min-height:calc(100vh - 44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-block:20px;text-align:center;color:var(--bp-text)}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(50px,10vw,104px);line-height:.92;margin:0;color:#f6f9ff;letter-spacing:.01em;text-shadow:0 5px 0 rgba(0,0,0,.28)}
.logo span{color:#ff6b5a;display:block}
.tagline{margin:0;font:500 clamp(14px,2.2vw,18px) var(--f-body);color:var(--bp-soft);max-width:44ch;text-wrap:balance}
.progressLine{margin:0;font:500 14px var(--f-body);color:var(--bp-soft)}
.progressLine b{color:#fff;font-family:var(--f-mono)}
.menuBtns{display:flex;flex-direction:column;gap:10px;width:min(330px,100%)}
.mbtn{font:600 17px var(--f-body);border-radius:10px;padding:12px 18px;cursor:pointer;border:2px solid #8fa9d6;background:rgba(16,33,61,.72);color:var(--bp-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;transition:background .15s,transform .08s}
.mbtn:hover{background:rgba(47,95,179,.45)}
.mbtn:active{transform:translateY(2px)}
.mbtn small{font:500 12px var(--f-body);color:var(--bp-soft)}
.mbtn.play{font:400 34px var(--f-display);background:var(--pencil);border-color:#ff8c7d;box-shadow:0 6px 0 var(--pencil-deep);padding:12px 18px;letter-spacing:.02em}
.mbtn.play:hover{background:#e0574a}
.mbtn.play:active{box-shadow:0 2px 0 var(--pencil-deep);transform:translateY(4px)}
.mbtn.cont{border-color:var(--gold);color:var(--gold)}
.mbtn.inline{width:auto;flex-direction:row;font-size:15px;padding:8px 14px}
.settings{position:relative}
.setmenu{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 8px);width:min(330px,92vw);background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:12px;z-index:5;box-shadow:5px 5px 0 rgba(0,0,0,.35)}
.setmenu .setlabel{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:600}
.setrow{display:flex;flex-direction:column;gap:6px}
.seg2{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg2 button{flex:1;font:600 14px var(--f-body);border:0;background:#fff;color:var(--ink);padding:7px;cursor:pointer}
.seg2 button+button{border-left:2px solid var(--ink)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.selWrap{width:min(1040px,100%);display:flex;flex-direction:column;gap:16px;text-align:left}
.selHead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.selHead h2{font:400 clamp(28px,5vw,44px) var(--f-display);margin:0;color:#fff;flex:1 1 auto;text-align:center}
.modeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.35);font:inherit;transition:transform .08s}
.mode:hover{transform:translateY(-2px)}
.mode[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:3px}
.mode h3{margin:0;font:400 25px var(--f-display);line-height:1.05}
.mode p{margin:0;font-size:13px;color:var(--ink-soft)}
.mode .prog{font:600 13px var(--f-mono);color:var(--pencil-deep)}
.mode svg{width:100%;height:70px;display:block;background:var(--paper);border:1px solid var(--line);border-radius:7px}
.mode.c h3{color:var(--pencil-deep)} .mode.d h3{color:var(--vector)} .mode.m h3{color:var(--mixed)} .mode.u h3{color:var(--ink)}
.levelPanel{background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.levelPanel h3{margin:0;font:400 24px var(--f-display)}
.levelPanel > p{margin:0;color:var(--ink-soft);font-size:14px;max-width:70ch}
.lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.lvCard{border:2px solid var(--ink);background:#fff;border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.lvCard:hover:not(:disabled){background:var(--inc-bg)}
.lvCard b{font:400 22px var(--f-display);line-height:1}
.lvCard span{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvCard small{color:var(--pencil);letter-spacing:.12em;min-height:1.3em;font-size:12px}
.lvCard small.off{color:var(--ink-soft);letter-spacing:0}
.lvCard:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
.lvCard.c b{color:var(--pencil-deep)} .lvCard.d{border-color:var(--vector)} .lvCard.d b{color:var(--vector)} .lvCard.m{border-color:var(--mixed)} .lvCard.m b{color:var(--mixed)}
.lvCard.new{border-style:dashed;justify-content:center}
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,16,32,.62);display:grid;place-items:center;padding:16px}
.modalCard{background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:12px;max-width:600px;width:100%;padding:16px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 rgba(0,0,0,.35);max-height:92vh;overflow:auto;text-align:left}
.modalCard h2{font:400 30px var(--f-display);margin:0}
.modalTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.howFig svg{width:100%;height:auto;display:block;background:var(--paper);border:1.5px solid var(--line);border-radius:8px}
.howStep h3{margin:0 0 4px;font:400 22px var(--f-display)}
.howStep p{margin:0 0 6px;max-width:62ch}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:var(--ink)}
.modalNav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ---- juego ---- */
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.gamebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.gamebar .left{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-width:0}
.brandSmall{font:400 26px var(--f-display);line-height:1}
.brandSmall span{color:var(--pencil)}
.topRight{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.score{display:flex;flex-direction:column;align-items:flex-end}
.score span{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft)}
.score b{font:600 24px var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.1}

.btn{font:600 14px var(--f-body);border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:7px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--pencil-deep);border-color:var(--pencil-deep)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.edit{background:var(--pencil);border-color:var(--pencil-deep);color:#fff}
.btn.vec{background:var(--vector);border-color:var(--vector);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:72vh;min-height:240px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--paper)}
.stage.editing{border-style:dashed;border-color:var(--pencil-deep)}
@media (max-width:640px){.stage{aspect-ratio:4/3}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 20px)}
.hud span{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1.5px solid var(--ink);border-radius:5px;padding:3px 8px;font:600 12px var(--f-body);font-variant-numeric:tabular-nums}
.hud span:empty{display:none}
.hud .shots{letter-spacing:.15em;color:var(--pencil)}
.hud .tag{background:var(--pencil);color:#fff;border-color:var(--pencil-deep)}
.hud .phase{background:var(--vector);color:#fff;border-color:var(--vector)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(28,42,72,.38);padding:16px}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:20px 24px;text-align:center;max-width:390px;box-shadow:6px 6px 0 var(--ink)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 6px}
.stars{font-size:30px;letter-spacing:.15em;color:var(--pencil);min-height:1.2em}
.stars .off{color:var(--line)}
.card p{margin:8px 0 16px;color:var(--ink-soft)}
.ovBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.stack{display:flex;flex-direction:column;gap:10px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.ctl{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl label,.lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl label i{font-family:var(--f-hand);text-transform:none;font-size:16px;letter-spacing:0;color:var(--ink);font-style:normal}
.lock{font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:4px;padding:1px 6px}
.hint{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--pencil)}
.num{display:flex;align-items:baseline;gap:4px}
.num input{width:4.6em}
input[type=number],input[type=text],select,textarea{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;border:1.5px solid var(--ink);border-radius:5px;padding:4px 6px;background:#fff;color:var(--ink);min-width:0}
select,input[type=text]{font-family:var(--f-body)}
input:disabled,select:disabled{background:var(--grid);border-color:var(--line);color:var(--ink-soft)}
.num em{font-style:normal;font:13px var(--f-mono);color:var(--ink-soft)}
.check,.ctl label.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.check input{accent-color:var(--pencil);width:16px;height:16px;flex:none}
.fire{font-family:var(--f-display);font-size:28px;border:2px solid var(--pencil-deep);background:var(--pencil);color:#fff;border-radius:8px;cursor:pointer;box-shadow:0 5px 0 var(--pencil-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;transition:transform .08s,box-shadow .08s;min-height:76px}
.fire small{font:500 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.fire:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--pencil-deep)}
.fire:disabled{filter:grayscale(.6);opacity:.6;cursor:wait}

.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.panel.find{border-color:var(--vector);border-width:2px}
.panel h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.panel h4{margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--vector)}
.panel.find h3{color:var(--vector)}
.eq{font-family:var(--f-mono);font-size:14px;display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.eq div{white-space:nowrap}
.eq .k{color:var(--pencil);font-weight:600}
.eq .note{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);white-space:normal;margin-top:4px}
.eq .pred{border-top:1px dashed var(--line);padding-top:6px;margin-top:4px;display:flex;flex-direction:column;gap:4px}
.tele{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 14px;font-variant-numeric:tabular-nums}
.tele div{display:flex;flex-direction:column;border-bottom:1px dotted var(--line);padding-bottom:3px}
.tele span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.tele b{font:600 17px var(--f-mono)}
.tele .msg{grid-column:1/-1;border:0;font-size:13px;color:var(--ink-soft);display:block}
.clues p{margin:0 0 6px;max-width:68ch}
.vlist{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.vrow{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-family:var(--f-mono);font-size:14px;border-left:3px solid var(--vector);padding:2px 0 2px 8px}
.vrow.r{border-left-color:var(--pencil-deep)}
.vrow b{font-family:var(--f-body);font-weight:600;min-width:2.2em}
.vrow em{font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--ink-soft);width:100%}
.unk{color:var(--vector);font-weight:600;background:var(--inc-bg);border-radius:4px;padding:0 4px}
.fb{display:flex;flex-direction:column;gap:2px;font-size:14px;min-height:1em}
.fb .ok{color:var(--target-dark);font-weight:600}
.fb .bad{color:var(--pencil-deep);font-weight:600}
.sol{font-family:var(--f-mono);font-size:14px;display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.sol div{white-space:nowrap}
.sol .k{color:var(--vector);font-weight:600}
.sol .res{font-family:var(--f-body);white-space:normal;font-weight:600;margin-bottom:4px}
.sol .sub{font-family:var(--f-body);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-top:6px}
.sol .next{font-family:var(--f-body);white-space:normal;color:var(--ink-soft);margin-top:6px}
.sol .ans{background:var(--inc-bg);border-radius:5px;padding:2px 6px}

/* ---- editor ---- */
.editor{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 14px var(--f-body);border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;flex:1 1 220px}
.tab small{font:500 12px var(--f-body);color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] small{color:var(--grid)}
.tab.d[aria-selected="true"]{background:var(--vector);border-color:var(--vector)}
.tab.m[aria-selected="true"]{background:var(--mixed);border-color:var(--mixed)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px}
.tool{font:600 13px var(--f-body);border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer;display:flex;gap:7px;align-items:center}
.tool i{width:12px;height:12px;border-radius:2px;border:1.5px solid var(--ink);display:inline-block}
.tool[data-tool=wood] i{background:var(--wood);border-color:var(--wood-dark)}
.tool[data-tool=stone] i{background:var(--stone);border-color:var(--stone-dark)}
.tool[data-tool=target] i{background:var(--target);border-color:var(--target-dark);border-radius:50%}
.tool[data-tool=terrain] i{background:var(--earth);border-color:var(--earth-dark)}
.tool[data-tool=select] i{border-style:dashed}
.tool[data-tool=start] i{background:var(--vector);border-color:var(--vector);border-radius:50%}
.tool[data-tool=erase] i{border-color:var(--pencil);background:linear-gradient(45deg,transparent 45%,var(--pencil) 45%,var(--pencil) 55%,transparent 55%)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolHint{font-size:13px;color:var(--ink-soft);flex:1 1 220px;min-width:0;padding-left:4px}
.toolbar .sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.edGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}
.edGrid .wide{grid-column:1/-1}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
.field input,.field select{width:100%}
.field.full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 20px}
.tablewrap{overflow-x:auto}
table.vars{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.vars th,.vars td{padding:5px 6px;text-align:left;border-bottom:1px dotted var(--line);vertical-align:middle}
.vars thead th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
.vars tbody th{font-weight:600;font-size:14px;white-space:nowrap}
.vars tbody th small{display:block;font:12px var(--f-mono);color:var(--ink-soft);font-weight:400}
.vars input[type=number]{width:6em}
.vars tr.locked td.rng input{opacity:.5}
.minis{display:flex;flex-wrap:wrap;gap:6px 10px}
.mini{display:flex;align-items:center;gap:4px;font:500 13px var(--f-mono);white-space:nowrap}
.mini input{width:5.2em}
.mini em{font-style:normal;color:var(--ink-soft);font-size:12px}
table.matrix{min-width:760px}
.matrix td{text-align:center}
.matrix td.na{color:var(--line)}
.matrix select{font:600 13px var(--f-body);padding:2px 4px;width:100%;min-width:4.6em}
.matrix select.st-dato{background:var(--ok-bg);border-color:var(--target-dark);color:var(--target-dark)}
.matrix select.st-inc{background:var(--inc-bg);border-color:var(--vector);color:var(--vector)}
.matrix select.st-oculto{color:var(--ink-soft);border-color:var(--line)}
.matrix small{display:block;font:11px var(--f-mono);color:var(--ink-soft);margin-top:2px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-soft)}
.legend b{font-weight:600;border-radius:4px;padding:0 5px}
.legend .ld{background:var(--ok-bg);color:var(--target-dark)}
.legend .li{background:var(--inc-bg);color:var(--vector)}

.tplgroup{display:flex;flex-direction:column;gap:6px}

.chipS{font:600 11px var(--f-body);border-radius:999px;padding:2px 8px;border:1.5px solid currentColor;white-space:nowrap}

.nameChips{display:flex;flex-wrap:wrap;gap:6px}

.tableWrap{overflow-x:auto}

<body>

<canvas id="bg" aria-hidden="true"></canvas>

<!-- ======== INICIO ======== -->
<main id="homeScreen" class="menuScreen">
  <h1 class="logo">Parábola <span>Brava</span></h1>
  <p class="tagline" data-l="Tiro parabólico y vectores de desplazamiento, sin resistencia del aire|Projectile motion and displacement vectors, with no air resistance"></p>
  <div class="menuBtns">
    <button class="mbtn play" id="btnPlay" type="button" data-l="Jugar|Play"></button>
    <div class="settings">
      <button class="mbtn online" id="btnOnline" type="button" aria-expanded="false" aria-controls="onlineMenu"><span data-l="Online|Online"></span><small data-l="Juega con otras personas|Play with other people"></small></button>
      <div class="setmenu onmenu" id="onlineMenu" hidden>
        <button class="onopt" id="btnOnJoin" type="button"><b data-l="Unirse a un juego|Join a game"></b><small data-l="Tengo un código de 5 caracteres|I have a 5-character code"></small></button>
        <button class="onopt" id="btnOnCreate" type="button"><b data-l="Crear un juego|Create a game"></b><small data-l="Elige los niveles y las reglas; los demás entran con tu código|Pick the levels and rules; others join with your code"></small></button>
      </div>
    </div>
    <button class="mbtn" id="btnHow" type="button" data-l="Cómo jugar|How to play"></button>
    <div class="settings">
      <button class="mbtn" id="btnSettings" type="button" aria-expanded="false" aria-controls="setMenu" data-l="Configuración|Settings"></button>
      <div class="setmenu" id="setMenu" hidden>
        <div class="setrow">
          <span class="setlabel" data-l="Idioma|Language"></span>
          <div class="seg2" role="group" data-la="Idioma|Language">
            <button type="button" data-lang="es">Español</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="setAnim"> <span data-l="Animaciones del fondo|Background animations"></span></label>
        <label class="check"><input type="checkbox" id="setSound"> <span data-l="Efectos de sonido|Sound effects"></span></label>
        <div class="setrow">
          <button class="btn danger small" id="btnReset" type="button" data-l="Reiniciar progreso|Reset progress"></button>
          <small class="hint" id="resetNote" data-l="Borra estrellas y niveles desbloqueados. Tus niveles creados se conservan.|Clears stars and unlocked levels. Your own levels are kept."></small>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ======== SELECCIÓN ======== -->
<main id="selectScreen" class="menuScreen" hidden>
  <div class="selWrap">
    <div class="selHead">
      <button class="mbtn inline" id="btnSelBack" type="button" data-l="← Inicio|← Home"></button>
      <h2 data-l="¿Qué quieres jugar?|What do you want to play?"></h2>
      <button class="btn edit" id="btnToEditor" type="button" data-l="Editor de niveles|Level editor"></button>

    <div class="modeGrid" id="modeGrid"></div>
    <div class="levelPanel" id="levelPanel"></div>
  </div>
</main>

<!-- ======== ONLINE ======== -->

  <div class="onWrap" id="onBody"></div>
</main>

<!-- ======== JUEGO ======== -->
<div id="gameScreen" class="app" hidden>

    <div class="left">
      <button class="btn ghost small" id="btnMenu" type="button" data-l="← Menú|← Menu"></button>

      <span class="hint">g = <span id="gLabel">9.81</span> m/s²</span>

    <div class="popcard" id="pop" hidden></div>
  </div>

  <!-- modo juego -->
  <div id="playUI" class="stack">
    <section id="findUI" class="panels" hidden>
      <div class="panel find">
        <h3 data-l="Datos conocidos|Known data"></h3>
        <div id="clues" class="clues"></div>
        <div class="btnrow"><button id="replay" class="btn ghost small" type="button" data-l="Repetir recorrido|Replay the path"></button></div>
      </div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const css = getComputedStyle(document.documentElement);
const C = {};
['paper','grid','grid-major','ink','ink-soft','pencil','pencil-deep','vector','mixed','wood','wood-dark','stone','stone-dark','target','target-dark','earth','earth-dark','line','bp','bp-line','bp-text','gold']
  .forEach(k => C[k] = css.getPropertyValue('--' + k).trim());

const R = 0.45;
const LAUNCH_CLEAR = 1.5;
const P = { v0: 18, ang: 45, h0: 2 };
let g = 9.81;

const num = (v, d) => { v = parseFloat(v); return isFinite(v) ? v : d; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const snap = (v, s) => Math.round(v / s) * s;
const r2 = v => Math.round(v * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
const f = (n, d = 2) => (Math.abs(n) < 1e-9 ? 0 : n).toFixed(d);
const sg = (n, d = 2) => (n >= 0 ? '+' : '−') + f(Math.abs(n), d);
const fmtN = n => { const v = Math.round(n * 100) / 100; return (Object.is(v, -0) ? 0 : v).toString().replace('-', '−'); };
const fmtS = n => (Math.round(n * 100) / 100 >= 0 ? '+' : '') + fmtN(n);
const newId = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const isMov = def => def && (def.type === 'despl' || def.type === 'mixto');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
   CONFIGURACIÓN E IDIOMA
   ========================================================= */
const SET = { lang: /^en\b/i.test(navigator.language || '') ? 'en' : 'es', anim: !reduceMotion, sound: true };
try { const s = JSON.parse(localStorage.getItem('parabola-brava-settings') || 'null'); if (s) Object.assign(SET, s); } catch (e) {}
function saveSet() { try { localStorage.setItem('parabola-brava-settings', JSON.stringify(SET)); } catch (e) {} }
const L = (es, en) => SET.lang === 'en' ? en : es;
/* Textos fijos del HTML: data-l="español|english" (también data-la para aria-label, data-lt para title, data-lp para placeholder) */
function applyStaticLang() {
  document.documentElement.lang = SET.lang;
  const pick = v => { const p = v.split('|'); return SET.lang === 'en' ? p[1] : p[0]; };
  document.querySelectorAll('[data-l]').forEach(el => el.textContent = pick(el.dataset.l));
  document.querySelectorAll('[data-la]').forEach(el => el.setAttribute('aria-label', pick(el.dataset.la)));
  document.querySelectorAll('[data-lt]').forEach(el => el.title = pick(el.dataset.lt));
  document.querySelectorAll('[data-lp]').forEach(el => el.placeholder = pick(el.dataset.lp));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === SET.lang)));
}

/* =========================================================
   SONIDO (sintetizado en el navegador)
   ========================================================= */
const SND = (() => {
  let ac = null;
  const get = () => {
    if (!SET.sound) return null;
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  const tone = (f0, f1, dur, type = 'sine', vol = .18, delay = 0) => {
    const a = get(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), gn = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  };
  const noise = (dur, freq, vol = .2, delay = 0, q = 1) => {
    const a = get(); if (!a) return;
    const t0 = a.currentTime + delay, n = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = a.createBufferSource(), bf = a.createBiquadFilter(), gn = a.createGain();
    src.buffer = buf; bf.type = 'bandpass'; bf.frequency.value = freq; bf.Q.value = q; gn.gain.value = vol;
    src.connect(bf).connect(gn).connect(a.destination); src.start(t0);
  };
  return {
    launch: () => { noise(.32, 900, .3, 0, .6); tone(200, 480, .22, 'triangle', .07); },
    thud: () => { tone(150, 50, .26, 'sine', .32); noise(.1, 300, .15); },
    wood: () => { noise(.16, 1700, .32, 0, 2); tone(320, 120, .1, 'square', .05); },
    stone: () => { noise(.24, 650, .34, 0, 1.4); tone(170, 60, .2, 'sawtooth', .06); },
    crack: () => noise(.08, 2500, .2, 0, 3),
    pop: () => { tone(480, 1150, .14, 'sine', .2); tone(900, 1800, .12, 'triangle', .09, .05); },
    good: () => { tone(660, 660, .13, 'triangle', .18); tone(880, 880, .24, 'triangle', .18, .12); },
    bad: () => tone(220, 130, .32, 'sawtooth', .08),
    win: () => [523, 659, 784, 1047].forEach((fq, i) => tone(fq, fq, .24, 'triangle', .15, i * .1)),
    click: () => tone(1100, 850, .05, 'square', .035),
    puff: () => noise(.3, 1200, .14, 0, .8),
  };
})();

/* ---------- variables del lanzamiento ---------- */
const GRAVS = [[9.81, ['Tierra', 'Earth']], [1.62, ['Luna', 'Moon']], [3.71, ['Marte', 'Mars']], [24.79, ['Júpiter', 'Jupiter']]];
const gName = pair => L(pair[0], pair[1]);
const VKEYS = ['v0', 'ang', 'h0'];
const VAR_META = {
  v0:  { es: 'Velocidad inicial v₀', en: 'Initial speed v₀', sym: 'v₀', unit: 'm/s', lo: 1,   hi: 80, d: { def: 18, min: 5,   max: 45, step: 0.5 } },
  ang: { es: 'Ángulo θ',             en: 'Angle θ',          sym: 'θ',  unit: '°',   lo: -89, hi: 89, d: { def: 45, min: -30, max: 85, step: 1 } },
  h0:  { es: 'Altura h₀',            en: 'Height h₀',        sym: 'h₀', unit: 'm',   lo: 0,   hi: 40, d: { def: 2,  min: 0,   max: 15, step: 0.5 } },
};
const varLabel = k => L(VAR_META[k].es, VAR_META[k].en);
function defaultVars() {
  const v = {}; VKEYS.forEach(k => v[k] = { ...VAR_META[k].d, locked: false });
  v.g = { def: 9.81, locked: false }; return v;
}
function normVars(src) {
  const out = defaultVars();
  VKEYS.forEach(k => {
    const m = VAR_META[k], s = (src && src[k]) || {}, o = out[k];
    o.min = r2(clamp(num(s.min, o.min), m.lo, m.hi));
    o.max = r2(clamp(num(s.max, o.max), m.lo, m.hi));
    if (o.max < o.min) [o.min, o.max] = [o.max, o.min];
    o.step = r2(clamp(num(s.step, o.step), 0.01, Math.max(0.01, (o.max - o.min) || 1)));
    o.def = r2(clamp(num(s.def, o.def), o.min, o.max));
    o.locked = !!s.locked;
  });
  const gsrc = (src && src.g) || {};
  out.g.def = r2(clamp(num(gsrc.def, 9.81), 0.1, 50)); out.g.locked = !!gsrc.locked;
  return out;
}

/* =========================================================
   VECTORES: modelo, valores y análisis de solvencia
   ========================================================= */
const DIRV = { ur: [1, 1], ul: [-1, 1], dl: [-1, -1], dr: [1, -1], r: [1, 0], l: [-1, 0], u: [0, 1], d: [0, -1] };
const DIR_NAMES = {
  ur: ['Arriba y a la derecha', 'Up and to the right'], ul: ['Arriba y a la izquierda', 'Up and to the left'],
  dl: ['Abajo y a la izquierda', 'Down and to the left'], dr: ['Abajo y a la derecha', 'Down and to the right'],
  r: ['Derecha', 'Right'], l: ['Izquierda', 'Left'], u: ['Arriba', 'Up'], d: ['Abajo', 'Down'],

  { key: 'd', list: CAMPAIGN_D, unlock: 'unlockedD', prefix: 'D', cls: 'd' },
  { key: 'm', list: CAMPAIGN_M, unlock: 'unlockedM', prefix: 'M', cls: 'm' },
];
function campaignOf(def) {
  for (const c of CAMPAIGNS) { const i = c.list.indexOf(def); if (i >= 0) return { ...c, i }; }
  return null;
}

/* ---------- almacenamiento ---------- */
const freshProg = () => ({ unlocked: 1, unlockedD: 1, unlockedM: 1, stars: {}, last: null, v: 3 });
let prog = freshProg();
try {
  const s = JSON.parse(localStorage.getItem('parabola-brava') || 'null');
  if (s && s.unlocked) {
    prog.unlocked = s.unlocked; prog.unlockedD = s.unlockedD || 1; prog.unlockedM = s.unlockedM || 1; prog.last = s.last || null;
    if (s.v !== 3) { prog.unlockedM = Math.max(prog.unlockedM, s.unlockedD || 1); prog.unlockedD = 1; }
    if (Array.isArray(s.stars)) s.stars.forEach((v, i) => { if (v) prog.stars['c' + (i + 1)] = v; });
    else if (s.stars && typeof s.stars === 'object') {
      prog.stars = s.stars;
      if (s.v !== 3) ['d1', 'd2', 'd3', 'd4'].forEach((k, i) => { if (s.stars[k]) prog.stars['m' + (i + 1)] = s.stars[k]; delete prog.stars[k]; });
    }
  }
} catch (e) {}
prog.v = 3;
let customs = [];
try {
  const a = JSON.parse(localStorage.getItem('parabola-brava-custom') || '[]');
  if (Array.isArray(a)) customs = a.map(normLevel).map(l => { if (!l.id) l.id = newId(); return l; });
} catch (e) {}
function saveProg() { try { localStorage.setItem('parabola-brava', JSON.stringify(prog)); } catch (e) {} }
function saveCustoms() { try { localStorage.setItem('parabola-brava-custom', JSON.stringify(customs)); return true; } catch (e) { return false; } }
function findLevel(id) { return [...CAMPAIGN, ...CAMPAIGN_D, ...CAMPAIGN_M, ...customs].find(l => l.id === id) || null; }

/* ---------- estado ---------- */
const S = { def: null, objs: [], terrain: [], shotsLeft: 0, score: 0, levelStart: 0, mode: 'aim', proj: null,
            trails: [], parts: [], practiceUsed: false, last: null, top: 14, time: 0, screen: 'play', testing: false, next: null,
            phase: 'shoot', solved: false, res: null, ans: null, items: [], anim: null, mover: null, endTimer: 0 };
const E = { draft: null, tool: 'select', sel: null, drag: null, editingId: null, pointer: null,
            lastSize: { wood: [1, 2], stone: [1, 2] }, confirm: null, showGrid: true,
            hist: [], future: [], snapRound: false, dirty: false };
let VIEW = 'home';   // home · select · game

/* =========================================================
   MODO JUEGO
   ========================================================= */
function loadLevel(def, opts = {}) {
  showView('game');
  S.def = def; S.testing = !!opts.testing;
  if (!S.testing && !opts.online && def.id) { prog.last = def.id; saveProg(); }
  $('ovRetry').hidden = !!opts.online;
  S.objs = def.objs.map(o => ({ ...o, hp: o.k === 'stone' ? 2 : 1, alive: true, vy: 0, falling: false, fy: 0, blink: Math.random() * 4 }));
  S.terrain = def.terrain.slice();
  S.shotsLeft = def.shots; S.trails = []; S.parts = []; S.proj = null; S.mode = 'aim';
  S.practiceUsed = false; S.last = null; S.levelStart = S.score;
  S.phase = 'shoot'; S.solved = false; S.res = null; S.ans = null; S.items = []; S.anim = null; S.mover = null; S.endTimer = 0;
  let extraTop = 0;
  if (isMov(def)) {
    const m = def.mov, a = analyze(m); S.res = a.r;
    S.phase = 'find';
    S.items = a.inc.map(k => { const sk = splitKey(k); return { key: k, ...sk, truth: truthOf(a.r, sk.owner, sk.q) }; });
    S.ans = { tries: m.tries, used: 0, solved: false, failed: false, stars: 0, bonus: 0, lastFb: '' };
    if (m.ay > 0.05) S.terrain.push({ x: m.ax - 0.8, w: 1.6, h: m.ay, pillar: true });
    const Tg = { k: 'target', x: m.ax - 0.6, y: m.ay, w: 1.2, h: 1.2, hp: 1, alive: true, vy: 0, falling: false, fy: 0,
                 blink: Math.random() * 4, mover: true, fixed: true, hidden: false };
    S.objs.push(Tg); S.mover = Tg;
    extraTop = Math.max(...S.res.pts.map(p => p.y)) + 3;
    buildAnswerForm(); $('ansFb').innerHTML = '';
    startAnim();
  }
  S.top = Math.max(def.type === 'despl' ? 5 : 14, extraTop, ...S.terrain.map(t => t.h), ...def.objs.map(o => o.y + o.h));
  $('overlay').hidden = true;
  applyVars(def.vars);
  setScreen('play');
  renderFind(); hud(); tele(); syncUI();
}
function applyVars(v) {
  VKEYS.forEach(k => {
    const c = v[k], r = $(k), n = $(k + 'n'), unit = VAR_META[k].unit;
    [r, n].forEach(el => { el.min = c.min; el.max = c.max; el.step = c.step; el.disabled = c.locked; });
    r.value = c.def; n.value = c.def; P[k] = c.def;
    $(k + 'Lock').hidden = !c.locked;
    $(k + 'Hint').textContent = c.locked ? L(`El nivel la fija en ${c.def} ${unit}`, `The level fixes it at ${c.def} ${unit}`)
      : L(`Permitido: ${c.min} a ${c.max} ${unit} · paso ${c.step}`, `Allowed: ${c.min} to ${c.max} ${unit} · step ${c.step}`);
  });
  renderGravOptions(v.g.def);
  g = v.g.def; $('gLabel').textContent = g.toFixed(2);
  $('gLock').hidden = !v.g.locked;
}
function renderGravOptions(val) {
  const sel = $('grav'); sel.innerHTML = '';
  const list = GRAVS.map(([gv, n]) => [gv, gName(n)]);
  if (!list.some(([gv]) => Math.abs(gv - val) < 1e-6)) list.push([val, L('Del nivel', 'Level’s own')]);
  list.forEach(([gv, n]) => { const o = document.createElement('option'); o.value = gv; o.textContent = `${n} · ${gv} m/s²`; sel.appendChild(o); });
  sel.value = String(list.find(([gv]) => Math.abs(gv - val) < 1e-6)[0]);
}
function targetsLeft() { return S.objs.filter(o => o.k === 'target' && o.alive).length; }

function hud() {
  if (VIEW !== 'game') return;
  if (S.screen === 'edit') {
    const d = E.draft; if (!d) return;
    $('hudTag').textContent = L('Editor', 'Editor');
    $('hudPhase').textContent = { clasico: '', despl: L('Desplazamiento', 'Displacement'), mixto: L('Mixto', 'Mixed') }[d.type];
    $('hudLevel').textContent = d.name;
    $('hudShots').textContent = d.type === 'despl' ? '' : L(`${d.shots} tiro${d.shots > 1 ? 's' : ''}`, `${d.shots} shot${d.shots > 1 ? 's' : ''}`);
    const n = d.objs.filter(o => o.k === 'target').length + (d.type === 'mixto' ? 1 : 0), nv = d.mov ? d.mov.vecs.length : 0;
    $('hudTargets').textContent = d.type === 'despl' ? L(`${nv} vector${nv > 1 ? 'es' : ''}`, `${nv} vector${nv > 1 ? 's' : ''}`) : L(`Objetivos: ${n}`, `Targets: ${n}`);
  } else {
    const d = S.def; if (!d) return;
    const c = campaignOf(d);
    $('hudTag').textContent = S.online ? 'Online' : S.testing ? L('Prueba', 'Test') : '';
    $('hudPhase').textContent = d.type === 'despl' ? (S.solved ? L('Resuelto', 'Solved') : L('Encuentra las incógnitas', 'Find the unknowns'))
      : d.type === 'mixto' ? (S.phase === 'find' ? L('Fase 1 · Vectores', 'Phase 1 · Vectors') : L('Fase 2 · Lanza', 'Phase 2 · Launch')) : '';
    $('hudLevel').textContent = S.online ? `${S.online.i + 1}/${S.online.list.length} · ${lvName(d)}` : c ? `${c.prefix}${c.i + 1} · ${lvName(d)}` : lvName(d);
    $('hudShots').textContent = d.type === 'despl' ? '' : d.shots >= 900 ? L('Tiros: ∞', 'Shots: ∞') : '●'.repeat(Math.max(0, S.shotsLeft)) + '○'.repeat(Math.max(0, d.shots - S.shotsLeft));
    $('hudShots').setAttribute('aria-label', L(`${S.shotsLeft} tiros restantes`, `${S.shotsLeft} shots left`));
    $('hudTargets').textContent = (S.phase === 'find' || d.type === 'despl') ? '' : L(`Objetivos: ${targetsLeft()}`, `Targets: ${targetsLeft()}`);
  }
  $('score').textContent = S.score.toLocaleString(SET.lang === 'en' ? 'en' : 'es');
}
function updateGameBar() {
  const eb = $('editBtn'), et = $('editThis');
  eb.hidden = !!S.online; $('btnMenu').textContent = S.online ? L('Salir de la partida', 'Leave game') : L('← Menú', '← Menu');
  if (S.online) { et.hidden = true; return; }
  if (S.screen === 'edit') { eb.textContent = L('Salir del editor', 'Exit editor'); et.hidden = true; }
  else if (S.testing) { eb.textContent = L('Volver al editor', 'Back to editor'); et.hidden = true; }
  else {
    eb.textContent = L('Editor de niveles', 'Level editor'); et.hidden = !S.def;
    if (S.def) et.textContent = customs.some(c => c.id === S.def.id) ? L('Editar este nivel', 'Edit this level') : L('Copiar al editor', 'Copy to editor');
  }
}

/* ---------- fase de vectores ---------- */
function startAnim() {
  const m = S.def.mov, Tg = S.mover;
  S.terrain = S.terrain.filter(t => !t.final);
  Tg.x = m.ax - 0.6; Tg.y = m.ay; Tg.hidden = false; Tg.fixed = true;
  S.anim = { t: 0, pause: 0.8, legDur: 1.1, prog: 0 };
}
function updateAnim(dt) {
  const a = S.anim; if (!a) return;
  a.t += dt;
  const m = S.def.mov, pts = S.res.pts, Tg = S.mover, t = a.t - a.pause;
  if (t < 0) return;
  if (m.showPath) {
    const n = pts.length - 1, total = n * a.legDur, tt = Math.min(t, total);
    const i = Math.min(n - 1, Math.floor(tt / a.legDur));
    let u = (tt - i * a.legDur) / a.legDur; u = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const x = pts[i].x + (pts[i + 1].x - pts[i].x) * u, y = pts[i].y + (pts[i + 1].y - pts[i].y) * u;
    Tg.x = x - 0.6; Tg.y = y; a.prog = i + u;
    if (t >= total) { S.anim = null; arriveVisual(); }
  } else {
    puff(m.ax, m.ay + 0.6, C.target); Tg.hidden = true; S.anim = null;
  }
}
function arriveVisual() {
  const F = S.res.F;
  S.mover.x = F.x - 0.6; S.mover.y = F.y;
  if (F.y > 0.05 && !S.terrain.some(t => t.final)) S.terrain.push({ x: F.x - 0.8, w: 1.6, h: F.y, final: true });
}
function puff(x, y, col) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
    S.parts.push({ k: 'chip', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 1, life: .9, max: .9, col, size: .25, nograv: true });
  }
  S.parts.push({ k: 'ring', x, y, life: .5, max: .5 });
  SND.puff();
}
$('replay').onclick = () => { if (S.phase === 'find' && S.def.mov.showPath) startAnim(); };
$('ansCheck').onclick = checkAnswer;

function buildAnswerForm() {
  const box = $('ansFields'), prev = S.items.map((_, i) => { const el = $(`ans-${i}`); return el ? el.value : ''; });
  box.innerHTML = '';
  S.items.forEach((it, i) => {
    const lab = document.createElement('label'); lab.className = 'field' + (it.q === 'dir' ? ' full' : '');
    if (it.q === 'dir') lab.innerHTML = `<span></span><select id="ans-${i}"><option value="">${L('Elige una dirección…', 'Choose a direction…')}</option>${DIR_ORDER.map(k => `<option value="${k}">${dirName(k)}</option>`).join('')}</select>`;
    else lab.innerHTML = `<span></span><input type="number" id="ans-${i}" step="any" inputmode="decimal">`;
    const unit = Q_UNIT[it.q];
    lab.querySelector('span').textContent = keyLabel(it.key) + (unit ? ` (${unit})` : '') + (it.q === 'x' || it.q === 'y' ? L(' con signo', ', signed') : '');
    box.appendChild(lab);
    if (prev[i]) $(`ans-${i}`).value = prev[i];
  });
}
function vecClueRow(owner, kind, show, vals) {
  const qs = owner === 'R' ? R_Q : Q_BY_KIND[kind];
  const items = [];
  qs.forEach(q => {
    const s = show[q]; if (s === 'oculto') return;
    const sym = symOf(q, owner);
    if (s === 'inc') items.push(`<span class="unk">${sym} = ?</span>`);
    else if (q === 'dir') items.push(`<span>${L('dirección', 'direction')}: ${fmtQ(q, vals[q])}</span>`);
    else items.push(`<span>${sym} = ${fmtQ(q, vals[q])}</span>`);
  });
  const note = owner === 'R' ? L('desplazamiento total de A a B (vector resultante)', 'total displacement from A to B (resultant vector)')
    : kindNote(kind) + (kind === 'acc' && show.v0 === 'dato' && vals.v0 === 0 ? L(' · parte del reposo', ' · starts from rest') : '');
  return `<div class="vrow${owner === 'R' ? ' r' : ''}"><b>${vname(owner)}</b>${items.length ? items.join('') : `<span style="color:var(--ink-soft)">${L('sin datos', 'no data')}</span>`}<em>${note}</em></div>`;
}
function renderFind() {
  const d = S.def, show = isMov(d);
  $('findUI').hidden = !show;
  $('shootUI').hidden = show && (d.type === 'despl' || S.phase === 'find');
  if (!show) return;
  const m = d.mov, r = S.res, n = m.vecs.length;
  let c = `<p>${L(`El cochinito parte del punto <b>A</b> y se mueve con ${n === 1 ? 'un vector' : `${n} vectores seguidos`}. Llega al punto <b>B</b>.`,
    `The piglet starts at point <b>A</b> and moves along ${n === 1 ? 'one vector' : `${n} vectors in a row`}. It ends at point <b>B</b>.`)}</p><div class="vlist">`;
  m.vecs.forEach((V, i) => { c += vecClueRow(i, V.kind, V.show, r.vals[i]); });
  c += vecClueRow('R', null, m.R.show, r.R) + '</div>';
  c += `<p class="hint">${L('Ángulos medidos desde la horizontal (0° a 90°). Componentes con signo: + hacia la derecha o arriba, − hacia la izquierda o abajo.',
    'Angles are measured from the horizontal (0° to 90°). Signed components: + to the right or up, − to the left or down.')}</p>`;
  $('clues').innerHTML = c;
  $('replay').hidden = !m.showPath || S.phase !== 'find';
  $('ansTitle').textContent = S.items.length === 1 ? L('Encuentra la incógnita', 'Find the unknown') : L('Encuentra las incógnitas', 'Find the unknowns');
  if (S.phase === 'find') {
    $('ansForm').hidden = false; $('ansSol').hidden = true;
    const left = S.ans.tries - S.ans.used;
    $('ansTries').textContent = S.ans.tries >= 900 ? L(`Intentos ilimitados · se acepta ±${m.tolD}% en valores y ±${m.tolA}° en ángulos`, `Unlimited attempts · ±${m.tolD}% on values and ±${m.tolA}° on angles accepted`) : L(`${left} intento${left !== 1 ? 's' : ''} · se acepta ±${m.tolD}% en valores y ±${m.tolA}° en ángulos`,
      `${left} attempt${left !== 1 ? 's' : ''} left · ±${m.tolD}% on values and ±${m.tolA}° on angles accepted`);
  } else {
    $('ansForm').hidden = true; $('ansSol').hidden = false; $('ansSol').innerHTML = solutionHTML();
  }
}
function solutionHTML() {
  const m = S.def.mov, r = S.res, a = S.ans;
  const head = a.solved
    ? `<div class="res" style="color:var(--target-dark)">${a.used > 1 ? L(`¡Correcto en el intento ${a.used}!`, `Correct on attempt ${a.used}!`) : L('¡Correcto al primer intento!', 'Correct on the first try!')} +${a.bonus} ${L('puntos', 'points')}</div>`
    : `<div class="res" style="color:var(--pencil-deep)">${L('Se acabaron los intentos. Esta es la solución:', 'Out of attempts. Here is the solution:')}</div>`;
  let h = head + (!a.solved && a.lastFb ? `<div class="fb" style="font-family:var(--f-body);white-space:normal">${a.lastFb}</div>` : '');
  h += `<div class="sub">${L('Respuesta', 'Answer')}</div>` + S.items.map(it => `<div class="ans"><span class="k">${keyLabel(it.key)}</span> = <b>${fmtQ(it.q, it.truth)}</b></div>`).join('');
  h += `<div class="sub">${L('Todos los valores del problema', 'Every value in the problem')}</div>`;
  m.vecs.forEach((V, i) => {
    const v = r.vals[i], n = vname(i);
    if (V.kind === 'vel') h += `<div><span class="k">|${n}|</span> = v·t = ${fmtN(v.v)}·${fmtN(v.t)} = <b>${f(v.d)} m</b></div>`;
    if (V.kind === 'acc') h += `<div><span class="k">|${n}|</span> = v₀·t + ½·a·t² = ${fmtN(v.v0)}·${fmtN(v.t)} + ½·${fmtN(v.a)}·${fmtN(v.t)}² = <b>${f(v.d)} m</b></div>`;
    h += `<div><span class="k">${n}</span>: |${n}| = ${f(v.d)} m, θ = ${f(v.ang, 1)}°, ${dirLow(v.dir)} → Δx = <b>${sg(v.x)}</b>, Δy = <b>${sg(v.y)}</b></div>`;
  });
  const vs = r.vals;
  h += `<div><span class="k">Rₓ</span> = ${vs.length > 1 ? vs.map(v => sg(v.x)).join(' ') + ' = ' : ''}<b>${sg(r.dx)} m</b></div>
    <div><span class="k">Rᵧ</span> = ${vs.length > 1 ? vs.map(v => sg(v.y)).join(' ') + ' = ' : ''}<b>${sg(r.dy)} m</b></div>
    <div><span class="k">|R|</span> = √(Rₓ² + Rᵧ²) = √(${f(r.dx * r.dx)} + ${f(r.dy * r.dy)}) = <b>${f(r.mag)} m</b></div>
    <div><span class="k">${L('θ de R', 'θ of R')}</span> = arctan(|Rᵧ| / |Rₓ|) = arctan(${f(Math.abs(r.dy))} / ${f(Math.abs(r.dx))}) = <b>${f(r.angH, 1)}°</b></div>
    <div><span class="k">${L('Dirección de R', 'Direction of R')}</span>: <b>${dirLow(r.dir)}</b></div>`;
  if (S.def.type === 'mixto') {
    h += `<div><span class="k">B</span> = A + R = (${f(m.ax, 1)} ${sg(r.dx)}, ${f(m.ay, 1)} ${sg(r.dy)}) = <b>(${f(r.F.x)}, ${f(r.F.y)}) m</b></div>
      <div class="next">${L('Ahora la escala está visible. Lanza para alcanzar al cochinito en B.', 'The scale is visible now. Launch to hit the piglet at B.')}</div>`;
  }
  return h;
}
function itemCorrect(it, val) {
  const m = S.def.mov, r = S.res;
  if (it.q === 'dir') {
    const v = it.owner === 'R' ? { x: r.dx, y: r.dy, ang: r.angH } : r.vals[it.owner];
    return validDirs(v.x, v.y, v.ang, it.truth, m.tolA).includes(val);
  }
  if (it.q === 'ang') return Math.abs(val - it.truth) <= m.tolA;
  return Math.abs(val - it.truth) <= Math.max(ABS_TOL[it.q] || 0.1, Math.abs(it.truth) * m.tolD / 100);
}
function checkAnswer() {
  if (S.phase !== 'find') return;
  const a = S.ans;
  const vals = S.items.map((it, i) => it.q === 'dir' ? $(`ans-${i}`).value : parseFloat(String($(`ans-${i}`).value).replace(',', '.')));
  if (vals.some((v, i) => S.items[i].q === 'dir' ? !v : !isFinite(v))) {
    $('ansFb').innerHTML = `<span class="bad">${L('Completa todas las casillas antes de comprobar.', 'Fill in every box before checking.')}</span>`; return;
  }
  a.used++;
  let all = true;
  const lines = S.items.map((it, i) => {
    const ok = itemCorrect(it, vals[i]), lab = keyLabel(it.key); if (!ok) all = false;
    if (ok) return `<span class="ok">✓ ${lab}: ${L('correcto', 'correct')}</span>`;
    if (it.q === 'dir') return `<span class="bad">✗ ${lab}: ${L('incorrecta', 'wrong')}</span>`;
    const wrongSign = (it.q === 'x' || it.q === 'y') && Math.abs(it.truth) > 0.3 && Math.sign(vals[i]) !== Math.sign(it.truth);
    return `<span class="bad">✗ ${lab}: ${wrongSign ? L('revisa el signo', 'check the sign') : vals[i] > it.truth ? L('tu valor es demasiado grande', 'your value is too big') : L('tu valor es demasiado pequeño', 'your value is too small')}</span>`;
  }).join('');
  a.lastFb = lines;
  if (S.online) onlineAnswer(vals);
  if (all) {
    a.solved = true; a.stars = a.used === 1 ? 3 : a.used === 2 ? 2 : 1;
    a.bonus = [1500, 1000, 600, 400, 300, 200][a.used - 1] || 200; S.score += a.bonus;
    SND.good(); reveal(); return;
  }
  SND.bad();
  if (a.used >= a.tries) { a.failed = true; reveal(); return; }
  $('ansFb').innerHTML = lines; renderFind();
}
function reveal() {
  const F = S.res.F, Tg = S.mover;
  S.anim = null; S.solved = true;
  if (Tg.hidden) puff(F.x, F.y + 0.6, C.target);
  Tg.hidden = false; Tg.x = F.x - 0.6; Tg.y = F.y;
  if (F.y > 0.05 && !S.terrain.some(t => t.final)) S.terrain.push({ x: F.x - 0.8, w: 1.6, h: F.y, final: true });
  floatText(F.x, F.y + 2.2, S.ans.solved ? L('¡Resuelto!', 'Solved!') : L('Aquí estaba', 'It was here'), S.ans.solved ? C.vector : C['pencil-deep']);
  S.top = Math.max(S.top, F.y + 3);
  if (S.def.type === 'mixto') { S.phase = 'shoot'; Tg.fixed = false; }
  else { S.phase = 'done'; S.endTimer = 2.2; }
  renderFind(); hud(); syncUI();
}

/* ---------- controles del jugador ---------- */
function bind(rid, nid, key) {
  const r = $(rid), n = $(nid);
  r.addEventListener('input', () => { P[key] = +r.value; n.value = r.value; syncUI(); });
  n.addEventListener('change', () => {
    let v = parseFloat(String(n.value).replace(',', '.')); if (isNaN(v)) v = P[key];

function theory(v0, ang, h0, gg) {
  const th = ang * Math.PI / 180, vx = v0 * Math.cos(th), vy = v0 * Math.sin(th);
  const tf = (vy + Math.sqrt(vy * vy + 2 * gg * h0)) / gg;
  const hmax = vy > 0 ? h0 + vy * vy / (2 * gg) : h0;
  return { vx, vy, tf, range: vx * tf, hmax, tApex: vy > 0 ? vy / gg : 0 };
}
function syncUI() {
  if (!S.def) return;

  const practice = $('practice').checked;
  let h = `
    <div><span class="k">vₓ</span> = v₀·cos θ = ${f(P.v0,1)}·cos ${P.ang}° = <b>${f(th.vx)} m/s</b></div>
    <div><span class="k">vᵧ₀</span> = v₀·sin θ = ${f(P.v0,1)}·sin ${P.ang}° = <b>${f(th.vy)} m/s</b></div>
    <div><span class="k">x(t)</span> = ${f(th.vx)}·t</div>
    <div><span class="k">y(t)</span> = ${f(P.h0,1)} ${th.vy < 0 ? '−' : '+'} ${f(Math.abs(th.vy))}·t − ${f(g / 2, 3)}·t²</div>
    <div><span class="k">vᵧ(t)</span> = ${f(th.vy)} − ${f(g)}·t</div>`;
  if (practice) {
    h += `<div class="pred">
      <div>${L('h máx', 'max h')} = h₀ + vᵧ₀²/(2g) = <b>${f(th.hmax)} m</b>${th.vy > 0 ? ` (t = ${f(th.tApex)} s)` : ''}</div>
      <div>${L('t vuelo', 'flight t')} (y = 0) = <b>${f(th.tf)} s</b></div>
      <div>${L('Alcance', 'Range')} (y = 0) = vₓ·t = <b>${f(th.range)} m</b></div></div>`;
  } else {
    h += `<div class="note">${L('Calcula tú el alcance y la altura máxima, o activa el modo práctica para verlos (ese nivel no dará estrellas).',
      'Work out the range and maximum height yourself, or turn on practice mode to see them (that level won’t award stars).')}</div>`;
  }
  $('eq').innerHTML = h;
  $('fire').disabled = S.mode !== 'aim' || S.phase !== 'shoot';
  $('grav').disabled = S.def.vars.g.locked || S.mode === 'fly';
}

/* ---------- disparo y física ---------- */
function fire() {
  if (S.screen !== 'play' || S.phase !== 'shoot' || S.mode !== 'aim' || S.shotsLeft <= 0) return;
  const v = S.def.vars;
  VKEYS.forEach(k => { P[k] = v[k].locked ? v[k].def : clamp(P[k], v[k].min, v[k].max); });
  if (v.g.locked) g = v.g.def;
  const th = P.ang * Math.PI / 180;
  S.proj = { t: 0, vx: P.v0 * Math.cos(th), vy0: P.v0 * Math.sin(th), h0: P.h0, v0: P.v0, ang: P.ang, g,
             x: 0, y: P.h0, done: false, doneT: 0, pts: [{ x: 0, y: P.h0 }], lastPt: 0, ymax: P.h0, apexX: 0, hit: null, tBefore: targetsLeft() };
  S.shotsLeft--; S.mode = 'fly';
  if ($('practice').checked) S.practiceUsed = true;
  SND.launch();
  hud(); syncUI();
}
function circRect(x, y, r, o) {
  const cx = Math.max(o.x, Math.min(x, o.x + o.w)), cy = Math.max(o.y, Math.min(y, o.y + o.h));
  return (x - cx) ** 2 + (y - cy) ** 2 < r * r;
}
function collide(x, y) {
  for (const o of S.objs) {
    if (!o.alive || o.hidden) continue;
    if (o.k === 'target') { if ((x - o.x - 0.6) ** 2 + (y - o.y - 0.6) ** 2 < (R + 0.6) ** 2) return { type: 'obj', o }; }
    else if (circRect(x, y, R, o)) return { type: 'obj', o };
  }
  for (const t of S.terrain) if (circRect(x, y, R, { x: t.x, y: 0, w: t.w, h: t.h })) return { type: 'terrain' };
  if (y <= 0) return { type: 'ground' };
  if (x > S.def.W + 10 || x < -10) return { type: 'out' };
  return null;
}
function updateProj(dt) {
  const p = S.proj; if (!p) return;
  if (p.done) { p.doneT += dt; return; }
  const n = 12, h = dt / n;
  for (let i = 0; i < n; i++) {
    p.t += h;
    const x = p.vx * p.t, y = p.h0 + p.vy0 * p.t - 0.5 * p.g * p.t * p.t;
    p.x = x; p.y = y;
    if (y > p.ymax) { p.ymax = y; p.apexX = x; }
    if (p.t - p.lastPt >= 0.05) { p.pts.push({ x, y }); p.lastPt = p.t; }
    const hit = collide(x, y);
    if (hit) { impact(p, hit); break; }
  }
}
function impact(p, hit) {
  p.done = true; p.hit = hit.type;
  if (hit.type === 'ground') {
    const tf = (p.vy0 + Math.sqrt(p.vy0 ** 2 + 2 * p.g * p.h0)) / p.g;
    p.t = tf; p.x = p.vx * tf; p.y = 0;
  }
  const vy = p.vy0 - p.g * p.t; p.vImp = Math.hypot(p.vx, vy);
  p.pts.push({ x: p.x, y: p.y });
  if (hit.type === 'obj') {
    const o = hit.o;
    if (o.k === 'target') killTarget(o);
    else if (o.k === 'wood' || p.vImp >= 18) breakBlock(o);
    else { o.hp--; if (o.hp <= 0) breakBlock(o); else { floatText(p.x, p.y + 1, L('¡crack!', 'crack!'), C['stone-dark']); SND.crack(); } }
  } else if (hit.type !== 'out') SND.thud();
  if (hit.type !== 'out') dust(p.x, Math.max(p.y, 0));
}
function floatText(x, y, text, col) { S.parts.push({ k: 'text', x, y, vy: 1.4, life: 1.6, max: 1.6, text, col }); }
function dust(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI;
    S.parts.push({ k: 'chip', x, y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: .6, max: .6, col: C.earth, size: .15 });
  }
}
function killTarget(o) {
  if (!o.alive) return;
  o.alive = false; S.score += 500; SND.pop();
  const cx = o.x + 0.6, cy = o.y + 0.6;
  S.parts.push({ k: 'ring', x: cx, y: cy, life: .5, max: .5 });
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
    S.parts.push({ k: 'chip', x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 2, life: 1, max: 1, col: C.target, size: .22 });
  }
  floatText(cx, cy + 1, '+500', C.pencil); hud();
}
function breakBlock(o) {
  if (!o.alive) return;
  o.alive = false; const pts = o.k === 'stone' ? 100 : 50; S.score += pts;
  o.k === 'stone' ? SND.stone() : SND.wood();
  const n = Math.min(18, Math.ceil(o.w * o.h * 4) + 6);
  for (let i = 0; i < n; i++) {
    S.parts.push({ k: 'chip', x: o.x + Math.random() * o.w, y: o.y + Math.random() * o.h,
      vx: (Math.random() - .5) * 6, vy: Math.random() * 5, life: 1.2, max: 1.2,
      col: o.k === 'stone' ? C.stone : C.wood, size: .18 + Math.random() * .2, rot: Math.random() * 6 });
  }
  floatText(o.x + o.w / 2, o.y + o.h + .6, '+' + pts, C.ink); hud();
}
function overlapX(a, b) { return Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) > 0.05; }
function support(o) {
  let y = 0, who = null;
  for (const t of S.terrain) if (overlapX(o, t) && t.h <= o.y + 1e-3 && t.h > y) { y = t.h; who = null; }
  for (const p of S.objs) {
    if (p === o || !p.alive || p.hidden) continue;
    const top = p.y + p.h;
    if (overlapX(o, p) && top <= o.y + 1e-3 && top > y) { y = top; who = p; }
  }
  return { y, who };
}
function settle(dt) {
  const list = S.objs.filter(o => o.alive && !o.fixed && !o.hidden).sort((a, b) => a.y - b.y);
  for (const o of list) {
    if (!o.alive) continue;
    const sp = support(o);
    if (o.y > sp.y + 1e-3) {
      if (!o.falling) { o.falling = true; o.fy = o.y; o.vy = 0; }
      o.vy -= g * dt; const ny = o.y + o.vy * dt;
      if (ny <= sp.y) {
        o.y = sp.y; const drop = o.fy - sp.y; o.falling = false; o.vy = 0;
        if (o.k === 'target' && drop > 1.0) killTarget(o);
        else if (o.k !== 'target') {
          if (sp.who && sp.who.k === 'target') killTarget(sp.who);
          if (o.k === 'wood' && drop > 3) breakBlock(o);
        }
      } else o.y = ny;
    } else if (o.falling) { o.falling = false; o.vy = 0; }
  }
}
function anyFalling() { return S.objs.some(o => o.alive && o.falling); }
function updateParts(dt) {
  for (const p of S.parts) {
    p.life -= dt;
    if (p.k === 'chip') { if (!p.nograv) p.vy -= g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot != null) p.rot += dt * 6; }
    else if (p.k === 'text') p.y += p.vy * dt;
  }
  S.parts = S.parts.filter(p => p.life > 0);
}

/* ---------- fin de tiro / nivel ---------- */
function endShot() {
  const p = S.proj; S.trails.push(p); if (S.trails.length > 4) S.trails.shift();
  S.last = p; S.proj = null;
  if (S.online) onlineShot(p, Math.max(0, (p.tBefore || 0) - targetsLeft()));
  if (targetsLeft() === 0) win();
  else if (S.shotsLeft <= 0) lose();
  else S.mode = 'aim';
  hud(); tele(); syncUI();
}
function setNext(label, fn) { $('ovNext').hidden = !fn; $('ovNext').textContent = label || ''; S.next = fn; }
function starsHTML(n) { return [0, 1, 2].map(i => `<span class="${i < n ? '' : 'off'}">★</span>`).join(''); }
function unlockAndNext(d, stars) {
  prog.stars[d.id] = Math.max(prog.stars[d.id] || 0, stars);
  const c = campaignOf(d);
  if (c) prog[c.unlock] = Math.min(c.list.length, Math.max(prog[c.unlock], c.i + 2));
  saveProg();
  if (c) setNext(c.i === c.list.length - 1 ? L('Volver al primero', 'Back to the first') : L('Siguiente nivel', 'Next level'), () => loadLevel(c.list[(c.i + 1) % c.list.length]));
  else {
    const ui = customs.findIndex(x => x.id === d.id), has = ui >= 0 && ui < customs.length - 1;
    setNext(has ? L('Siguiente de mis niveles', 'Next of my levels') : null, has ? () => loadLevel(customs[ui + 1]) : null);
  }
  return c;
}
function retryLabel() { $('ovRetry').textContent = S.testing ? L('Repetir prueba', 'Test again') : L('Repetir nivel', 'Retry level'); }
function endDespl() {
  const d = S.def, a = S.ans; S.mode = 'end';
  if (S.online) { onlineLevelEnd(a.failed ? 'f' : 'w', a.failed ? 0 : a.stars); return; }
  retryLabel();
  if (a.failed) {
    $('ovTitle').textContent = L('Sin intentos', 'Out of attempts');
    $('ovStars').innerHTML = '';
    $('ovText').textContent = L('Revisa la solución paso a paso debajo de la escena y vuelve a intentarlo.', 'Check the step-by-step solution below the scene and try again.');
    setNext(S.testing ? L('Volver al editor', 'Back to editor') : null, S.testing ? backToEditor : null);
    SND.bad();
  } else {
    const stars = S.testing ? 0 : a.stars;
    $('ovStars').innerHTML = starsHTML(stars);
    const tries = L(`${a.used} intento${a.used > 1 ? 's' : ''}`, `${a.used} attempt${a.used > 1 ? 's' : ''}`);
    if (S.testing) {
      $('ovTitle').textContent = L('Prueba superada', 'Test passed');
      $('ovText').textContent = L(`Lo resolviste en ${tries}.`, `You solved it in ${tries}.`);
      setNext(L('Volver al editor', 'Back to editor'), backToEditor);
    } else {
      const c = unlockAndNext(d, stars);
      $('ovTitle').textContent = c && c.i === c.list.length - 1 ? L('¡Campaña completada!', 'Campaign complete!') : L('¡Resuelto!', 'Solved!');
      $('ovText').textContent = L(`Lo resolviste en ${tries}: +${a.bonus} puntos. La solución completa está debajo de la escena.`,
        `You solved it in ${tries}: +${a.bonus} points. The full solution is below the scene.`);
    }
    SND.win();
  }
  $('overlay').hidden = false; updateGameBar();
}
function win() {
  const d = S.def; S.mode = 'end';
  const used = d.shots - S.shotsLeft, bonus = d.shots >= 900 ? 0 : S.shotsLeft * 1000; S.score += bonus;
  let stars = used === 1 ? 3 : used === 2 ? 2 : 1;
  if (d.type === 'mixto') stars = Math.min(stars, S.ans.failed ? 1 : S.ans.stars);
  if (S.practiceUsed || S.testing) stars = 0;
  if (S.online) { onlineLevelEnd('w', stars); return; }
  $('ovStars').innerHTML = starsHTML(stars);
  const ansNote = d.type === 'mixto' ? (S.ans.solved
    ? L(` Resolviste los vectores en ${S.ans.used} intento${S.ans.used > 1 ? 's' : ''}.`, ` You solved the vectors in ${S.ans.used} attempt${S.ans.used > 1 ? 's' : ''}.`)
    : L(' No resolviste los vectores, así que el máximo es una estrella.', ' You didn’t solve the vectors, so the most you can get is one star.')) : '';
  if (S.testing) {
    $('ovTitle').textContent = L('Prueba superada', 'Test passed');
    $('ovText').textContent = L(`El nivel se puede ganar: lo resolviste con ${used} de ${d.shots} tiros.${ansNote}`, `The level can be won: you beat it with ${used} of ${d.shots} shots.${ansNote}`);
    setNext(L('Volver al editor', 'Back to editor'), backToEditor);
  } else {
    const c = unlockAndNext(d, stars);
    $('ovTitle').textContent = c && c.i === c.list.length - 1 ? L('¡Campaña completada!', 'Campaign complete!') : L('¡Nivel superado!', 'Level complete!');
    $('ovText').textContent = L(`Tiros usados: ${used} de ${d.shots}. Bonus por tiros sobrantes: +${bonus}.`, `Shots used: ${used} of ${d.shots}. Bonus for unused shots: +${bonus}.`) + ansNote +
      (S.practiceUsed ? L(' Usaste el modo práctica, así que este intento no suma estrellas.', ' You used practice mode, so this attempt earns no stars.') : '');
  }
  retryLabel(); SND.win();
  $('overlay').hidden = false; updateGameBar();
}
function lose() {
  if (S.online) { onlineLevelEnd('f', 0); return; }
  S.mode = 'end';
  $('ovTitle').textContent = L('Sin tiros', 'Out of shots');
  $('ovStars').innerHTML = '';
  const n = targetsLeft();
  $('ovText').textContent = L(`Quedan ${n} objetivo${n > 1 ? 's' : ''}. Ajusta v₀, θ o h₀ y vuelve a intentarlo.`, `${n} target${n > 1 ? 's' : ''} left. Adjust v₀, θ or h₀ and try again.`);
  retryLabel();
  setNext(S.testing ? L('Volver al editor', 'Back to editor') : null, S.testing ? backToEditor : null);

function cell(label, val) { return `<div><span>${label}</span><b>${val}</b></div>`; }
function tele() {
  const el = $('tele'); const p = S.proj;
  if (p && !p.done) {
    const vy = p.vy0 - p.g * p.t;
    el.innerHTML = cell('t', f(p.t) + ' s') + cell('x', f(p.x) + ' m') + cell('y', f(p.y) + ' m') +
      cell('vₓ', f(p.vx) + ' m/s') + cell('vᵧ', f(vy) + ' m/s') + cell('|v|', f(Math.hypot(p.vx, vy)) + ' m/s');
    return;
  }
  const q = (p && p.done) ? p : S.last;
  if (q) {
    const what = { ground: L('suelo', 'ground'), terrain: L('terreno', 'terrain'), obj: L('estructura', 'structure'), out: L('fuera del mapa', 'off the map') }[q.hit];
    el.innerHTML = cell(L('Impacto en', 'Hit'), what) + cell(L('t impacto', 'impact t'), f(q.t) + ' s') + cell(L('x impacto', 'impact x'), f(q.x) + ' m') +
      cell(L('y impacto', 'impact y'), f(q.y) + ' m') + cell(L('h máx', 'max h'), f(q.ymax) + ' m') + cell(L('|v| impacto', 'impact |v|'), f(q.vImp) + ' m/s') +

  const len = vecVals(V).d, nv = { ...V, kind };
  if (kind === 'dist') nv.d = r2(len);
  if (kind === 'vel') { nv.t = V.t || 2; nv.v = r2(len / nv.t); }
  if (kind === 'acc') { nv.t = V.t || 2; nv.v0 = 0; nv.a = r2(2 * len / (nv.t * nv.t)); }
  const show = defaultShow(kind);
  ['ang', 'dir', 'x', 'y'].forEach(q => show[q] = V.show[q]);
  if (kind !== 'dist') show.d = V.show.d === 'dato' ? 'oculto' : V.show.d;

   ========================================================= */
function askable(m) {
  const res = {}, base = analyze(m);
  const test = (owner, q, show) => {
    const key = `${owner}.${q}`;
    if (show[q] === 'inc') { res[key] = !base.missing.includes(key); return; }
    const save = show[q]; show[q] = 'inc';
    res[key] = !analyze(m).missing.includes(key);
    show[q] = save;
  };
  m.vecs.forEach((V, i) => Q_BY_KIND[V.kind].forEach(q => test(i, q, V.show)));
  R_Q.forEach(q => test('R', q, m.R.show));
  return res;
}
function nameOf(owner, q) {
  const base = symOf(q, owner);
  if (q === 'dir') return base;
  return `${base} <small>${q === 'ang' ? '°' : Q_UNIT[q]}</small>`;
}
function derivedNote(owner, q, V, m) {
  if (owner === 'R') return L(`al cambiarlo se ajusta ${vname(adjIndex(m))}`, `changing it adjusts ${vname(adjIndex(m))}`);
  if (q === 'd' && V.kind === 'vel') return L(`= v·t (al cambiarlo se ajusta ${V.stretch === 't' ? 't' : 'v'})`, `= v·t (changing it adjusts ${V.stretch === 't' ? 't' : 'v'})`);
  if (q === 'd' && V.kind === 'acc') return L(`= v₀t + ½at² (al cambiarlo se ajusta ${V.stretch === 't' ? 't' : 'a'})`, `= v₀t + ½at² (changing it adjusts ${V.stretch === 't' ? 't' : 'a'})`);
  if (q === 'x' || q === 'y') return L('al cambiarlo se ajustan |V| y θ', 'changing it adjusts |V| and θ');
  return '';
}
function svRow(owner, q, prefix, ask) {
  const m = E.draft.mov, r = resultant(m), isR = owner === 'R';
  const V = isR ? null : m.vecs[owner], show = isR ? m.R.show : V.show;
  const vals = isR ? r.R : r.vals[owner], key = `${owner}.${q}`, st = show[q];
  const pureAng = !isR && q === 'ang' && isPure(V.dir);
  const id = `${prefix}-${owner}-${q}`, label = keyLabel(key);
  let val;

  else if (q === 'dir') val = `<select id="${id}" data-o="${owner}" data-q="dir" aria-label="${label}">${DIR_ORDER.map(k => `<option value="${k}" ${k === vals.dir ? 'selected' : ''}>${DIR_ARROW[k]} ${dirName(k)}</option>`).join('')}</select>`;
  else val = `<input type="number" step="any" id="${id}" data-o="${owner}" data-q="${q}" value="${r2(vals[q])}" aria-label="${label}">`;
  let seg = '', note = '', cls = '';
  if (!pureAng) {
    seg = `<span class="seg" role="group" aria-label="${L('Qué sabe el jugador de', 'What the player knows about')} ${label}">` + ['dato', 'inc', 'oculto'].map(s => {
      const off = s === 'inc' && !ask[key] && st !== 'inc';
      return `<button type="button" class="s-${s}" data-o="${owner}" data-q="${q}" data-s="${s}" aria-pressed="${st === s}" ${off ? `disabled title="${L('Con los datos actuales no se puede calcular', 'It can’t be worked out from the current data')}"` : ''}>${s === 'dato' ? L('Dato', 'Given') : s === 'inc' ? '?' : '—'}</button>`;
    }).join('') + '</span>';
    if (st === 'inc') { note = ask[key] ? L('✓ incógnita con solución', '✓ solvable unknown') : L('✗ no se puede calcular con los datos actuales', '✗ can’t be worked out from the current data'); cls = ask[key] ? 'good' : 'bad'; }
    else note = ask[key] ? L('se puede pedir como incógnita', 'can be asked as an unknown') : L('aún no se puede pedir', 'can’t be asked yet');
    const der = derivedNote(owner, q, V, m); if (der) note = der + ' · ' + note;
  }
  return `<div class="sv-row st-${pureAng ? 'oculto' : st}"><span class="sv-name">${nameOf(owner, q)}</span><span class="sv-val">${val}</span>${seg}<span class="sv-note ${cls}">${note}</span></div>`;
}
function bindRows(root) {
  root.querySelectorAll('.sv-val input, .sv-val select').forEach(el => el.addEventListener('change', () => {
    const o = el.dataset.o === 'R' ? 'R' : +el.dataset.o, q = el.dataset.q;
    const val = q === 'dir' ? el.value : parseFloat(String(el.value).replace(',', '.'));

  }));
  root.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    const o = b.dataset.o === 'R' ? 'R' : +b.dataset.o, m = E.draft.mov;
    const show = o === 'R' ? m.R.show : m.vecs[o].show;

}
function buildSmart() {
  const d = E.draft; if (!isMov(d)) return;

    const isR = owner === 'R', V = isR ? null : m.vecs[owner], qs = isR ? R_Q : Q_BY_KIND[V.kind];
    const sel = E.sel && ((isR && E.sel.type === 'R') || (!isR && E.sel.type === 'vec' && E.sel.i === owner)) ? ' sel' : '';
    const head = isR ? `R <small>${L('resultante · de A a B', 'resultant · from A to B')}</small>`
      : `${vname(owner)} <small>${kindLabel(V.kind).toLowerCase()}</small>${adjIndex(m) === owner ? ` <span class="badge" title="${L('Absorbe los cambios cuando editas R', 'Absorbs the changes when you edit R')}">${L('ajustable', 'adjustable')}</span>` : ''}`;
    return `<div class="svcard${isR ? ' r' : ''}${sel}"><h5 data-sel="${owner}" title="${L('Seleccionar en la escena', 'Select in the scene')}">${head}</h5>${qs.map(q => svRow(owner, q, 'sv', ask)).join('')}</div>`;
