}

/* --- cambiar valores: cada cambio mantiene coherente el problema --- */
function setVecLen(V, len) {
  len = clamp(len, 0.5, 80);
  if (V.kind === 'dist') V.d = r2(len);
  else if (V.kind === 'vel') { if (V.stretch === 't') V.t = r2(clamp(len / V.v, 0.1, 60)); else V.v = r2(clamp(len / V.t, 0.1, 50)); }
  else if (V.stretch === 't') V.t = r2(clamp((-V.v0 + Math.sqrt(V.v0 * V.v0 + 2 * V.a * len)) / V.a, 0.1, 60));
  else V.a = r2(clamp(2 * (len - V.v0 * V.t) / (V.t * V.t), 0.05, 20));
}
function setVecXY(i, x, y) {
  const V = E.draft.mov.vecs[i]; let len = Math.hypot(x, y);
  if (len < 0.5) { if (len > 1e-9) { x *= 0.5 / len; y *= 0.5 / len; } else { x = 0.5; y = 0; } len = 0.5; }
  const wasPure = isPure(V.dir);
  V.dir = dirOf(x, y);
  V.ang = isPure(V.dir) ? ((V.dir === 'r' || V.dir === 'l') ? 0 : 90) : r2(Math.atan2(Math.abs(y), Math.abs(x)) * 180 / Math.PI);
  if (wasPure && !isPure(V.dir) && V.show.dir === 'dato' && V.show.ang === 'oculto') V.show.ang = 'dato';
  setVecLen(V, len);
}
function setRXY(x, y) {
  const m = E.draft.mov, r = resultant(m), adj = adjIndex(m);
  const o = r.vals.reduce((s, v, i) => i === adj ? s : { x: s.x + v.x, y: s.y + v.y }, { x: 0, y: 0 });
  setVecXY(adj, x - o.x, y - o.y);
}
function setQuantity(owner, q, val) {
  const m = E.draft.mov;
  if (owner === 'R') {
    const r = resultant(m); let x = r.dx, y = r.dy;
    const sx = x < -0.05 ? -1 : 1, sy = y < -0.05 ? -1 : 1;
    if (q === 'd') { if (r.mag > 1e-6) { x *= val / r.mag; y *= val / r.mag; } else x = val; }
    else if (q === 'ang') { const a = clamp(val, 0, 90) * Math.PI / 180; x = sx * r.mag * Math.cos(a); y = sy * r.mag * Math.sin(a); }
    else if (q === 'dir') {
      const [dx, dy] = DIRV[val];
      if (dx === 0) { x = 0; y = dy * r.mag; } else if (dy === 0) { x = dx * r.mag; y = 0; }
      else { const a = (r.angH < 1 || r.angH > 89 ? 45 : r.angH) * Math.PI / 180; x = dx * r.mag * Math.cos(a); y = dy * r.mag * Math.sin(a); }
    }
    else if (q === 'x') x = val; else if (q === 'y') y = val;
    setRXY(x, y); return;
  }
  const V = m.vecs[owner], cur = vecVals(V);
  if (q === 'd') setVecLen(V, val);
  else if (q === 'v') V.v = r2(clamp(val, 0.1, 50));
  else if (q === 't') V.t = r2(clamp(val, 0.1, 60));
  else if (q === 'a') V.a = r2(clamp(val, 0.05, 20));
  else if (q === 'v0') V.v0 = r2(clamp(val, 0, 30));
  else if (q === 'ang') { if (!isPure(V.dir)) V.ang = r2(clamp(val, 0, 90)); }
  else if (q === 'dir') {
    const wasPure = isPure(V.dir); V.dir = val;
    if (isPure(val)) V.ang = (val === 'r' || val === 'l') ? 0 : 90;
    else if (wasPure) { V.ang = 30; if (V.show.dir === 'dato' && V.show.ang === 'oculto') V.show.ang = 'dato'; }
  }
  else if (q === 'x') setVecXY(owner, val, cur.y);
  else if (q === 'y') setVecXY(owner, cur.x, val);
}

/* --- estado y botón Arreglar --- */
function movStatus() {
  const d = E.draft, sv = solvability(d.mov), geo = movProblems(d), r = sv.a.r, el = $('sv-status');
  let h = sv.ok ? L('✓ Se puede resolver. El jugador debe encontrar: ', '✓ Solvable. The player must find: ') +
    sv.a.inc.map(k => { const { owner, q } = splitKey(k); return `<b>${keyLabel(k)} = ${fmtQ(q, truthOf(r, owner, q))}</b>`; }).join(', ') + '.' : sv.text;
  if (geo) h += `<br><b>${geo}</b>`;
  h += `<br><span class="hint">B = (${f(r.F.x)}, ${f(r.F.y)}) m · ${L(`se ajusta ${vname(adjIndex(d.mov))} cuando editas R`, `${vname(adjIndex(d.mov))} adjusts when you edit R`)}</span>`;
  if (!sv.ok || geo) h += ` <button class="btn small edit" type="button" id="sv-fix">${L('Arreglar', 'Fix')}</button>`;
  el.innerHTML = h; el.className = 'status' + (sv.ok && !geo ? '' : ' bad');
  const fx = $('sv-fix'); if (fx) fx.onclick = autoFix;
}
function autoFix() {
  pushHist();
  const d = E.draft, m = d.mov, notes = [];
  let sv = solvability(m);
  if (!sv.a.inc.length) { Object.assign(m.R.show, { d: 'inc', ang: 'inc', dir: 'inc' }); notes.push(L('marqué |R|, θ y dirección de R como incógnitas', 'marked |R|, θ and direction of R as unknowns')); sv = solvability(m); }
  let fallback = false, guard = 0;
  while (!sv.ok && sv.a.missing.length && guard++ < 30) {
    const cands = [];
    m.vecs.forEach((V, i) => Q_BY_KIND[V.kind].forEach(q => { if (V.show[q] === 'oculto' && !(q === 'ang' && isPure(V.dir))) cands.push([i, q]); }));
    R_Q.forEach(q => { if (m.R.show[q] === 'oculto') cands.push(['R', q]); });
    let best = null, bestMiss = sv.a.missing.length;
    for (const [o, q] of cands) {
      const show = o === 'R' ? m.R.show : m.vecs[o].show;
      show[q] = 'dato'; const miss = analyze(m).missing.length; show[q] = 'oculto';
      if (miss < bestMiss) { bestMiss = miss; best = [o, q]; if (!miss) break; }
    }
    if (best) {
      (best[0] === 'R' ? m.R.show : m.vecs[best[0]].show)[best[1]] = 'dato';
      notes.push(L(`${keyLabel(`${best[0]}.${best[1]}`)} pasa a ser dato`, `${keyLabel(`${best[0]}.${best[1]}`)} is now given`));
    } else if (!fallback) {
      fallback = true;
      m.vecs.forEach(V => { const p = showPrimary(V); Object.keys(p).forEach(q => { if (p[q] === 'dato' && V.show[q] === 'oculto') V.show[q] = 'dato'; }); });
      notes.push(L('mostré los datos básicos de los vectores', 'showed the vectors’ basic data'));
    } else break;
    sv = solvability(m);
  }
  if (!sv.ok && sv.a.missing.length) {
    sv.a.missing.forEach(k => { const { owner, q } = splitKey(k); (owner === 'R' ? m.R.show : m.vecs[owner].show)[q] = 'oculto'; });
    notes.push(L('oculté las incógnitas que no tenían solución', 'hid the unknowns that had no solution'));
    if (!solvability(m).a.inc.length) { Object.assign(m.R.show, { d: 'inc', ang: 'inc', dir: 'inc' }); m.vecs.forEach(V => { const p = showPrimary(V); Object.keys(p).forEach(q => { if (p[q] === 'dato') V.show[q] = 'dato'; }); }); }
  }
  const lo = LAUNCH_CLEAR + 0.6;
  let r = resultant(m);
  if (r.F.x > d.W - 0.6) {
    const need = r.F.x - (d.W - 0.6);
    if (m.ax - need - 0.5 >= lo) { m.ax = r2(m.ax - need - 0.5); notes.push(L('moví A a la izquierda', 'moved A left')); }
    else { d.W = r2(Math.min(150, Math.ceil(r.F.x + 2))); notes.push(L(`amplié el mundo a ${d.W} m`, `widened the world to ${d.W} m`)); }
  }
  r = resultant(m);
  if (r.F.x < lo) {
    const need = lo - r.F.x;
    if (m.ax + need + 0.5 <= d.W - 0.6) { m.ax = r2(m.ax + need + 0.5); notes.push(L('moví A a la derecha', 'moved A right')); }
    else { d.W = r2(Math.min(150, d.W + need + 2)); m.ax = r2(m.ax + need + 0.5); notes.push(L(`amplié el mundo a ${d.W} m`, `widened the world to ${d.W} m`)); }
  }
  r = resultant(m);
  if (r.F.y < 0) { m.ay = r2(Math.min(30, m.ay - r.F.y + 0.5)); notes.push(L('subí A', 'raised A')); }
  if (r.F.y > 35) { m.ay = r2(Math.max(0, m.ay - (r.F.y - 35) - 0.5)); notes.push(L('bajé A', 'lowered A')); }
  d.mov = normMov(m, d.W);
  refreshAll();
  const left = solvability(d.mov).ok && !movProblems(d);
  msg(notes.length ? L(`Arreglado: ${notes.join(', ')}.${left ? '' : ' Aún queda algo por revisar.'} Puedes deshacerlo.`, `Fixed: ${notes.join(', ')}.${left ? '' : ' Something still needs checking.'} You can undo it.`)
                   : L('No encontré nada que arreglar automáticamente.', 'I found nothing to fix automatically.'), notes.length && left ? 'ok' : 'err');
}

/* --- vista avanzada: tabla de vectores y matriz --- */
const VAL_FIELDS = { dist: [['d', '|V|', 'm']], vel: [['v', 'v', 'm/s'], ['t', 't', 's']], acc: [['a', 'a', 'm/s²'], ['t', 't', 's'], ['v0', 'v₀', 'm/s']] };
function fillMovFields() {
  const m = E.draft.mov;
  $('mv-ax').value = m.ax; $('mv-ay').value = m.ay;
  $('mv-tries').value = m.tries; $('mv-tolD').value = m.tolD; $('mv-tolA').value = m.tolA;
  $('mv-hide').checked = m.hideScale; $('mv-path').checked = m.showPath;
  $('mv-add').disabled = m.vecs.length >= 4;
}
function buildAdvanced() {
  const m = E.draft.mov, tb = $('mv-vecs'); tb.innerHTML = '';
  m.vecs.forEach((V, i) => {
    const tr = document.createElement('tr');
    const vals = VAL_FIELDS[V.kind].map(([k, lab, unit]) =>
      `<label class="mini">${lab} <input type="number" id="mv-${k}-${i}" step="any" value="${V[k]}" aria-label="${vname(i)}: ${lab}"><em>${unit}</em></label>`).join('');
    tr.innerHTML = `<th scope="row">${vname(i)}</th>
      <td><select id="mv-kind-${i}" aria-label="${vname(i)}: ${L('tipo de magnitud', 'quantity type')}">${KINDS.map(k => `<option value="${k}" ${k === V.kind ? 'selected' : ''}>${kindLabel(k)}</option>`).join('')}</select></td>
      <td><div class="minis">${vals}</div></td>
      <td><input type="number" id="mv-ang-${i}" step="any" min="0" max="90" value="${V.ang}" ${isPure(V.dir) ? 'disabled' : ''} aria-label="${vname(i)}: ${L('ángulo', 'angle')}"></td>
      <td><select id="mv-dir-${i}" aria-label="${vname(i)}: ${L('dirección', 'direction')}">${DIR_ORDER.map(k => `<option value="${k}" ${k === V.dir ? 'selected' : ''}>${dirName(k)}</option>`).join('')}</select></td>
      <td>${m.vecs.length > 1 ? `<button class="btn danger small" type="button" data-rm="${i}">${L('Quitar', 'Remove')}</button>` : ''}</td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('input,select').forEach(el => el.addEventListener('change', readVecTable));
  tb.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => removeVec(+b.dataset.rm));
  buildMatrix();
}
function readVecTable() {
  pushHist();
  const d = E.draft, m = d.mov;
  m.vecs = m.vecs.map((V, i) => {
    const kind = $(`mv-kind-${i}`).value;
    if (kind !== V.kind) return setKindKeep(V, kind);
    const nv = { ...V, ang: $(`mv-ang-${i}`).value };
    VAL_FIELDS[V.kind].forEach(([k]) => { nv[k] = $(`mv-${k}-${i}`).value; });
    const dir = $(`mv-dir-${i}`).value;
    if (dir !== V.dir) { m.vecs[i] = normVec(nv); setQuantity(i, 'dir', dir); return m.vecs[i]; }
    return normVec(nv);
  });
  refreshMov();
}
['mv-ax', 'mv-ay', 'mv-tries', 'mv-tolD', 'mv-tolA', 'mv-hide', 'mv-path'].forEach(id => $(id).addEventListener('change', () => {
  pushHist();
  const d = E.draft, m = d.mov;
  d.mov = normMov({ ...m, ax: $('mv-ax').value, ay: $('mv-ay').value, hideScale: $('mv-hide').checked, showPath: $('mv-path').checked,
                    tolD: $('mv-tolD').value, tolA: $('mv-tolA').value, tries: $('mv-tries').value }, d.W);
  refreshMov();
}));
$('mv-add').onclick = () => {
  const m = E.draft.mov; if (m.vecs.length >= 4) return;
  pushHist(); m.vecs.push(normVec({ d: 5, ang: 30, dir: 'ur' }));
  E.sel = { type: 'vec', i: m.vecs.length - 1 };
  refreshMov(); msg(L(`Añadí ${vname(m.vecs.length - 1)}. Arrastra su punta en la escena o edítalo en su tarjeta.`, `Added ${vname(m.vecs.length - 1)}. Drag its tip in the scene or edit it in its card.`));
};
function removeVec(i) {
  const m = E.draft.mov; if (m.vecs.length <= 1) return;
  pushHist(); m.vecs.splice(i, 1);
  if (m.adj === i) m.adj = null; else if (m.adj != null && m.adj > i) m.adj--;
  E.sel = null; refreshMov(); msg(L('Quité el vector. Deshacer lo recupera.', 'Vector removed. Undo brings it back.'));
}
function buildMatrix() {
  const m = E.draft.mov, r = resultant(m), tb = $('mx-body');
  const row = (owner, kind, show, vals) => {
    const qs = owner === 'R' ? R_Q : Q_BY_KIND[kind];
    const pureAng = owner !== 'R' && isPure(vals.dir);
    const tds = Q_COLS.map(q => {
      if (!qs.includes(q) || (q === 'ang' && pureAng)) return `<td class="na" title="${q === 'ang' && pureAng ? L('La dirección ya fija el ángulo (0° o 90°)', 'The direction already sets the angle (0° or 90°)') : L('No aplica a este tipo', 'Doesn’t apply to this type')}">·</td>`;
      const s = show[q];
      return `<td><select id="mx-${owner}-${q}" class="st-${s}" aria-label="${keyLabel(`${owner}.${q}`)}">
        <option value="dato" ${s === 'dato' ? 'selected' : ''}>${L('Dato', 'Given')}</option>
        <option value="inc" ${s === 'inc' ? 'selected' : ''}>?</option>
        <option value="oculto" ${s === 'oculto' ? 'selected' : ''}>—</option></select><small>${q === 'dir' ? DIR_ARROW[vals[q]] : fmtN(vals[q])}</small></td>`;
    }).join('');
    return `<tr><th scope="row">${vname(owner)}<small>${owner === 'R' ? L('resultante', 'resultant') : kindLabel(kind).toLowerCase()}</small></th>${tds}</tr>`;
  };
  tb.innerHTML = m.vecs.map((V, i) => row(i, V.kind, V.show, r.vals[i])).join('') + row('R', null, m.R.show, r.R);
  tb.querySelectorAll('select').forEach(sel => sel.addEventListener('change', () => {
    const [, owner, q] = sel.id.split('-');

    (owner === 'R' ? m.R.show : m.vecs[+owner].show)[q] = sel.value;

  }));
}

/* =========================================================
   TARJETA FLOTANTE DE PROPIEDADES
   ========================================================= */
function popHead(title, sub, col) {
  return `<div class="pophead"><div><b style="color:${col}">${title}</b> <small class="hint">${sub}</small></div><button class="popclose" id="pp-close" type="button" aria-label="${L('Cerrar tarjeta', 'Close card')}">×</button></div>`;
}
function renderPop() {
  const pop = $('pop'), s = E.sel, d = E.draft;
  if (VIEW !== 'game' || S.screen !== 'edit' || !s || !d) { pop.hidden = true; return; }
  let h = '', cls = 'popcard';
  if (s.type === 'vec') {
    const m = d.mov, V = m && m.vecs[s.i]; if (!V) { pop.hidden = true; return; }
    const ask = askable(m); cls += ' vec';
    h = popHead(vname(s.i), kindLabel(V.kind).toLowerCase(), C.vector);
    h += `<div class="fields"><label class="field"><span>${L('Tipo de magnitud', 'Quantity type')}</span><select id="pp-kind">${KINDS.map(k => `<option value="${k}" ${k === V.kind ? 'selected' : ''}>${kindLabel(k)}</option>`).join('')}</select></label>`;
    if (V.kind !== 'dist') {
      const p = V.kind === 'vel' ? 'v' : 'a';
      h += `<label class="field"><span>${L('Al estirar cambia', 'Stretching changes')}</span><select id="pp-stretch"><option value="${p}" ${V.stretch !== 't' ? 'selected' : ''}>${p === 'v' ? L('la velocidad v', 'the speed v') : L('la aceleración a', 'the acceleration a')}</option><option value="t" ${V.stretch === 't' ? 'selected' : ''}>${L('el tiempo t', 'the time t')}</option></select></label>`;
    }
    h += `</div><label class="check"><input type="checkbox" id="pp-adj" ${adjIndex(m) === s.i ? 'checked' : ''}> ${L('Ajustable: absorbe los cambios cuando editas R', 'Adjustable: absorbs the changes when you edit R')}</label>`;
    h += `<div class="svcard">${Q_BY_KIND[V.kind].map(q => svRow(s.i, q, 'pp', ask)).join('')}</div>`;
    if (m.vecs.length > 1) h += `<div class="btnrow"><button class="btn danger small" type="button" id="pp-del">${L('Quitar vector', 'Remove vector')}</button></div>`;
  } else if (s.type === 'R') {
    const m = d.mov, ask = askable(m); cls += ' r';
    h = popHead('R', L('resultante de A a B', 'resultant from A to B'), C['pencil-deep']);
    h += `<p class="hint" style="margin:0">${L(`Al cambiar R se ajusta ${vname(adjIndex(m))}. Para que se ajuste otro, márcalo como “Ajustable” en su tarjeta.`, `Changing R adjusts ${vname(adjIndex(m))}. To adjust a different one, mark it “Adjustable” in its card.`)}</p>`;
    h += `<div class="svcard">${R_Q.map(q => svRow('R', q, 'pp', ask)).join('')}</div>`;
  } else if (s.type === 'A') {

  api.start = (r, c) => new Promise(resolve => {
    role = r; bc = new BroadcastChannel('pb-online-' + c);
    let otherHost = false, hostSeen = false;
    bc.onmessage = ev => {
      const m = ev.data; if (!m || m.from === me) return;
      if (m.k === 'ping') { if (last) post(mine()); return; }
      if (m.k === 'bye') { const id = idOf.get(m.from); if (id) { idOf.delete(m.from); seen.delete(m.from); api.onRemote(id, null); } return; }

        if (role === 'host') { otherHost = true; return; }
        hostSeen = true; idOf.set(m.from, 'host'); seen.set(m.from, Date.now()); api.onRemote('host', m.s);
      } else if (role === 'host' && m.role === 'p') {
        const id = String(m.s.id || m.from).slice(0, 24); idOf.set(m.from, id); seen.set(m.from, Date.now()); api.onRemote(id, m.s);
      }
    };
    post({ k: 'ping', from: me });
    setTimeout(() => {
      if (role === 'host' ? otherHost : !hostSeen) { bc.close(); bc = null; resolve({ ok: false, reason: role === 'host' ? 'taken' : 'notfound' }); return; }
      hb = setInterval(() => {
        if (last) post(mine());
        const now = Date.now();
        seen.forEach((t, from) => { if (now - t > 6000) { const id = idOf.get(from); seen.delete(from); idOf.delete(from); if (id) api.onRemote(id, null); } });
      }, 1500);
      resolve({ ok: true });
    }, role === 'host' ? 700 : 1400);
  });

  api.kick = () => {};
  api.close = () => { post({ k: 'bye', from: me }); clearInterval(hb); try { bc && bc.close(); } catch (e) {} bc = null; };
  return api;
}

  if (o.deadline && S.mode !== 'end' && !(S.def.type === 'despl' && S.solved) && performance.now() > o.deadline) {
    S.phase = 'done'; onlineLevelEnd('t', 0); return;
  }
  updateChip(false);
}
function updateChip(force) {
  const o = S.online; if (!o) return;
  let t = `${L('Online', 'Online')} · ${ON.code} · ${L('Nivel', 'Level')} ${o.i + 1}/${o.list.length}`;
  let warn = false;
  if (o.deadline && S.mode !== 'end') { const left = (o.deadline - performance.now()) / 1000; t += ` · ⏱ ${fmtTime(left)}`; warn = left < 15; }
  if (force || t !== o.lastChip) { o.lastChip = t; $('onChip').textContent = t; $('onChip').classList.toggle('warn', warn); }
}

async function downloadCsv() {
  const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = [[L('jugador', 'player'), L('nivel', 'level'), L('nombre_nivel', 'level_name'), L('tipo', 'type'), L('resultado', 'result'), L('intentos', 'attempts'), L('puntos', 'points'), L('tiempo_s', 'time_s'), L('detalle', 'detail')]];
  const resWord = c => [L('jugando', 'playing'), L('superado', 'passed'), L('fallado', 'failed'), L('tiempo agotado', 'time out')][c] || '';
  sortedPlayers().forEach(p => {
    rows.push([p.name, '', '', L('total', 'total'), p.kicked ? L('expulsado', 'removed') : !p.online ? L('desconectado', 'disconnected') : { wait: L('esperando', 'waiting'), play: L('jugando', 'playing'), done: L('terminó', 'finished') }[p.st], '', p.sc, '', '']);
    p.lv.slice().sort((a, b) => a[0] - b[0]).forEach(e => rows.push([p.name, e[0] + 1, levelNameFor(p, e[0]), L('nivel', 'level'), resWord(e[1]), e[3], e[2], e[4], '']));
    [...p.ev.values()].sort((a, b) => a[0] - b[0]).forEach(e => {
      if (e[2] === 'a') rows.push([p.name, e[1] + 1, levelNameFor(p, e[1]), L('respuesta', 'answer'), e[3] ? L('correcta', 'correct') : L('incorrecta', 'wrong'), '', '', '',
        (e[4] || []).map(([k, g, t, ok]) => `${keyLabel(k)}=${g} (${L('correcto', 'correct')} ${t}) ${ok ? '✓' : '✗'}`).join('; ')]);
      if (e[2] === 's') rows.push([p.name, e[1] + 1, levelNameFor(p, e[1]), L('tiro', 'shot'), e[6] ? L('acierto', 'hit') : L('fallo', 'miss'), '', '', '', `v0=${e[3]} θ=${e[4]} h0=${e[5]} x=${e[7]}`]);
    });
  });
  const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
  const filename = `parabola-brava-${ON.code}.csv`;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data: new Blob([csv], { type: 'text/csv' }) }); return; }
  } catch (e) { if (e && e.code && e.code !== 'unavailable') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* --- figuras pequeñas para las tarjetas y la guía --- */
function figSVG(kind, big) {
  const vb = big ? '0 0 300 130' : '0 0 300 90', gy = big ? 112 : 76, k = big ? 1.25 : 1;
  const ground = `<line x1="0" y1="${gy}" x2="300" y2="${gy}" stroke="#2b2b3a" stroke-width="2"/>`;
  const grid = `<pattern id="gp${kind}${big ? 'b' : ''}" width="15" height="15" patternUnits="userSpaceOnUse"><path d="M15 0H0V15" fill="none" stroke="#dfe7f4" stroke-width="1"/></pattern><rect width="300" height="${gy}" fill="url(#gp${kind}${big ? 'b' : ''})"/>`;
  const blob = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="-9" rx="11" ry="9.5" fill="#7cc46b" stroke="#3d7a32" stroke-width="2"/><circle cx="-4" cy="-11" r="2" fill="#1b1b29"/><circle cx="4" cy="-11" r="2" fill="#1b1b29"/><ellipse cx="0" cy="-6" rx="4" ry="2.6" fill="#a7db97" stroke="#3d7a32" stroke-width="1.2"/></g>`;
  const launcher = x => `<rect x="${x - 4}" y="${gy - 18}" width="8" height="18" fill="#8a5a33"/><circle cx="${x}" cy="${gy - 22}" r="6" fill="#d94d3f" stroke="#a83226" stroke-width="2"/>`;
  const arc = (x0, x1, top) => `<path d="M${x0} ${gy - 22} Q ${(x0 + x1) / 2} ${top} ${x1} ${gy - 10}" fill="none" stroke="#d94d3f" stroke-width="2.4" stroke-dasharray="5 5"/>`;
  const arrow = (x0, y0, x1, y1, col, dash) => {
    const a = Math.atan2(y1 - y0, x1 - x0), h = 8;
    return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${col}" stroke-width="2.6" ${dash ? 'stroke-dasharray="5 4"' : ''}/><path d="M${x1} ${y1} L${x1 - h * Math.cos(a - .45)} ${y1 - h * Math.sin(a - .45)} L${x1 - h * Math.cos(a + .45)} ${y1 - h * Math.sin(a + .45)}Z" fill="${col}"/>`;
  };
  const blocks = x => `<rect x="${x}" y="${gy - 30}" width="12" height="30" fill="#c8955c" stroke="#8a5a33" stroke-width="2"/><rect x="${x + 26}" y="${gy - 30}" width="12" height="30" fill="#9aa3b2" stroke="#5d6675" stroke-width="2"/><rect x="${x - 2}" y="${gy - 40}" width="42" height="10" fill="#c8955c" stroke="#8a5a33" stroke-width="2"/>`;
  let body = '';
  const top = big ? 0 : 4;
  if (kind === 'c') body = launcher(30) + arc(30, 240, top) + blocks(222) + blob(241, gy - 40);
  if (kind === 'd') { const y = gy - 14; body = blob(50, y + 14) + arrow(50, y, 130, y - 34 * k, '#2f5fb3') + arrow(130, y - 34 * k, 200, y - 34 * k, '#2f5fb3') + arrow(200, y - 34 * k, 240, y - 60 * k, '#2f5fb3') + arrow(50, y, 240, y - 60 * k, '#a83226', true) + `<g opacity=".45">${blob(240, y - 60 * k + 14)}</g>`; }
  if (kind === 'm') { const y = gy - 14; body = arrow(160, y, 210, y - 30 * k, '#2f5fb3') + arrow(210, y - 30 * k, 255, y - 30 * k, '#2f5fb3') + blob(255, y - 30 * k + 14) + `<rect x="245" y="${y - 30 * k + 14}" width="20" height="${gy - (y - 30 * k + 14)}" fill="#c9b18a" stroke="#7a6240" stroke-width="2"/>` + launcher(30) + `<path d="M30 ${gy - 22} Q 140 ${top} 250 ${y - 30 * k}" fill="none" stroke="#d94d3f" stroke-width="2.4" stroke-dasharray="5 5"/>`; }
  if (kind === 'u') body = blocks(120) + `<rect x="190" y="${gy - 20}" width="60" height="20" fill="#c9b18a" stroke="#7a6240" stroke-width="2"/>` + blob(220, gy - 20) +
    `<g transform="translate(60 ${gy - 50}) rotate(-35)"><rect x="0" y="-5" width="54" height="10" fill="#ffd166" stroke="#2b2b3a" stroke-width="2"/><path d="M54 -5 L66 0 L54 5Z" fill="#2b2b3a"/><rect x="-8" y="-5" width="8" height="10" fill="#e88" stroke="#2b2b3a" stroke-width="2"/></g>` +
    `<rect x="90" y="8" width="60" height="22" rx="4" fill="none" stroke="#2f5fb3" stroke-width="2" stroke-dasharray="4 3"/>`;
  return `<svg viewBox="${vb}" aria-hidden="true">${grid}${ground}${body}</svg>`;
}

      return `<button class="lvCard ${c.cls}" type="button" data-id="${l.id}" ${locked ? 'disabled' : ''} ${locked ? `aria-label="${c.prefix}${i + 1}. ${L('Bloqueado', 'Locked')}"` : ''}>
        <b>${c.prefix}${i + 1}</b><span>${lvName(l)}</span><small class="${locked || !st ? 'off' : ''}">${locked ? L('🔒 Bloqueado', '🔒 Locked') : st ? '★'.repeat(st) + '<span style="opacity:.25">' + '★'.repeat(3 - st) + '</span>' : L('Por jugar', 'Not played')}</small></button>`;
    }).join('');
  }
  pnl.innerHTML = `<h3>${info.t}</h3><p>${info.p}${MSEL !== 'u' ? ' ' + L('Supera un nivel para desbloquear el siguiente.', 'Beat a level to unlock the next one.') : ''}</p><div class="lvGrid">${cards}</div>`;
  pnl.querySelectorAll('.lvCard[data-id]').forEach(b => b.onclick = () => { SND.click(); const l = findLevel(b.dataset.id); if (l) loadLevel(l); });
  const nb = $('lvNew'); if (nb) nb.onclick = () => { SND.click(); E.draft = null; openEditor(null); };
}

let resetArmed = false;

/* =========================================================
   GUÍA «CÓMO JUGAR»
   ========================================================= */
let howI = 0, howReturn = null;
const HOW = () => [
  { fig: 'c', t: L('1 · Lanzamiento', '1 · Launch'),
    p: L('Elige la velocidad inicial v₀, el ángulo θ y la altura h₀, y pulsa <b>Lanzar</b>. Sin resistencia del aire, la trayectoria es una parábola exacta. Derriba a todos los cochinitos antes de quedarte sin tiros: cuantos menos uses, más estrellas.',
         'Choose the launch speed v₀, the angle θ and the height h₀, then press <b>Launch</b>. With no air resistance the path is an exact parabola. Knock down every piglet before you run out of shots: the fewer you use, the more stars you get.') },
  { fig: 'd', t: L('2 · Desplazamiento', '2 · Displacement'),
    p: L('El cochinito se mueve siguiendo vectores. Con los datos que te dan (magnitudes, ángulos, tiempos o componentes) calcula las incógnitas y pulsa <b>Comprobar</b>. La escala del plano se revela cuando aciertas.',
         'The piglet moves along vectors. Use the given data (lengths, angles, times or components) to work out the unknowns, then press <b>Check</b>. The grid scale is revealed once you get it right.') },
  { fig: 'm', t: L('3 · Mixta', '3 · Mixed'),
    p: L('Primero resuelve a dónde se movió el cochinito con sus vectores. Después, con su posición ya conocida, lánzale con la parábola correcta.',
         'First work out where the piglet moved using its vectors. Then, with its position known, launch at it with the right parabola.') },
  { fig: 'u', t: L('4 · Editor', '4 · Editor'),
    p: L('Crea tus propios niveles: usa plantillas, arrastra vectores, coloca bloques y decide qué variables puede cambiar el jugador. El editor comprueba que siempre haya solución, y puedes compartir cada nivel con un código.',
         'Make your own levels: use templates, drag vectors, place blocks and decide which variables the player can change. The editor checks there is always a solution, and you can share each level with a code.') },
];
function renderHow() {
  if ($('howModal').hidden) return;
  const steps = HOW(), s = steps[howI];
  $('howFig').innerHTML = figSVG(s.fig, true);
  $('howStep').innerHTML = `<h3>${s.t}</h3><p>${s.p}</p>`;
  $('howPrev').disabled = howI === 0;
  $('howNext').textContent = howI === steps.length - 1 ? L('¡A jugar!', 'Let’s play!') : L('Siguiente →', 'Next →');
  $('howDots').innerHTML = steps.map((_, i) => `<button type="button" aria-label="${L('Paso', 'Step')} ${i + 1}" ${i === howI ? 'aria-current="true"' : ''} data-i="${i}"></button>`).join('');
  $('howDots').querySelectorAll('button').forEach(b => b.onclick = () => { howI = +b.dataset.i; renderHow(); });
}
function openHow() { howReturn = document.activeElement; howI = 0; $('howModal').hidden = false; renderHow(); $('howNext').focus(); }
function closeHow() { $('howModal').hidden = true; if (howReturn && howReturn.focus) howReturn.focus(); }
$('howClose').onclick = closeHow;
$('howPrev').onclick = () => { if (howI > 0) { howI--; renderHow(); } };
$('howNext').onclick = () => { if (howI < HOW().length - 1) { howI++; renderHow(); } else { closeHow(); showView('select'); } };
$('howModal').addEventListener('click', e => { if (e.target === $('howModal')) closeHow(); });

/* =========================================================
   FONDO: PLANO DE INGENIERÍA ANIMADO
   ========================================================= */
function drawBG(t) {
  const w = bgW, h = bgH, c = bgx, line = C['bp-line'], gold = C.gold;
  c.setTransform(bgDpr, 0, 0, bgDpr, 0, 0);
  c.fillStyle = C.bp; c.fillRect(0, 0, w, h);
  const vg = c.createRadialGradient(w / 2, h * .45, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);
  vg.addColorStop(0, 'rgba(40,80,150,.35)'); vg.addColorStop(1, 'rgba(0,0,0,.35)');
  c.fillStyle = vg; c.fillRect(0, 0, w, h);
  // cuadrícula
  c.strokeStyle = line; c.lineWidth = 1;
  for (const [step, a] of [[24, .06], [120, .14]]) {
    c.globalAlpha = a; c.beginPath();
    for (let x = .5; x < w; x += step) { c.moveTo(x, 0); c.lineTo(x, h); }
    for (let y = .5; y < h; y += step) { c.moveTo(0, y); c.lineTo(w, y); }
    c.stroke();
  }
  c.globalAlpha = 1;
  // marco del plano
  c.globalAlpha = .35; c.strokeRect(10.5, 10.5, w - 21, h - 21); c.globalAlpha = 1;

  const u = Math.min(w, h * 1.4) / 900;               // escala general
  const gy = h * .86, x0 = w * .09, x1 = w * .86;
  const mono = s => `${Math.round(Math.max(10, s * u))}px 'IBM Plex Mono', monospace`;
  // suelo con rayado
  c.strokeStyle = line; c.globalAlpha = .55; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(18, gy); c.lineTo(w - 18, gy); c.stroke();
  c.globalAlpha = .25; c.beginPath();
  for (let x = 24; x < w - 18; x += 14) { c.moveTo(x, gy); c.lineTo(x - 9, gy + 9); }
  c.stroke(); c.globalAlpha = 1;

  // ciclo del lanzamiento (7 s): vuelo, salto del cochinito, pausa
  const cyc = 7, tc = t % cyc, fly = 2.6;
  const p = clamp(tc / fly, 0, 1), apexH = Math.min(h * .52, gy - 60);
  const lh = 34 * u;                                  // altura del lanzador
  const px = s => x0 + (x1 - x0) * s, py = s => gy - lh - 4 * apexH * s * (1 - s) + (lh - 10 * u) * s;
  // lanzador
  c.strokeStyle = line; c.lineWidth = 2; c.globalAlpha = .75;
  c.strokeRect(x0 - 7 * u, gy - lh, 14 * u, lh);
  c.beginPath(); c.arc(x0, gy - lh, 9 * u, 0, Math.PI * 2); c.stroke();
  // trayectoria punteada
  c.setLineDash([3, 9 * u + 3]); c.lineCap = 'round'; c.lineWidth = 3; c.strokeStyle = gold; c.globalAlpha = .85;
  c.beginPath();
  for (let i = 0; i <= 80 * p; i++) { const s = i / 80; i ? c.lineTo(px(s), py(s)) : c.moveTo(px(s), py(s)); }
  c.stroke(); c.setLineDash([]); c.lineCap = 'butt';
  // proyectil
  if (p < 1) { c.fillStyle = gold; c.globalAlpha = 1; c.beginPath(); c.arc(px(p), py(p), 7 * u + 2, 0, Math.PI * 2); c.fill(); }
  // vector v0 y ángulo
  const ang = Math.atan2(py(0) - py(.04), px(.04) - px(0));
  c.strokeStyle = line; c.globalAlpha = .8; c.lineWidth = 2;
  const vl = 80 * u + 20, vx = x0 + vl * Math.cos(ang), vy = gy - lh - vl * Math.sin(ang);
  c.beginPath(); c.moveTo(x0, gy - lh); c.lineTo(vx, vy); c.stroke();
  c.beginPath(); c.moveTo(vx, vy); c.lineTo(vx - 10 * Math.cos(ang - .4), vy + 10 * Math.sin(ang - .4)); c.lineTo(vx - 10 * Math.cos(ang + .4), vy + 10 * Math.sin(ang + .4)); c.closePath(); c.fillStyle = line; c.fill();
  c.setLineDash([4, 4]); c.beginPath(); c.moveTo(x0, gy - lh); c.lineTo(x0 + vl * 1.1, gy - lh); c.stroke(); c.setLineDash([]);
  c.beginPath(); c.arc(x0, gy - lh, vl * .55, -ang, 0); c.stroke();
  c.font = mono(14); c.fillStyle = C['bp-text']; c.globalAlpha = .8;
  c.fillText('θ', x0 + vl * .62, gy - lh - vl * .12);
  c.fillText('v₀', vx + 6, vy - 4);
  // cota de altura máxima y alcance
  c.strokeStyle = line; c.globalAlpha = .45; c.lineWidth = 1; c.setLineDash([6, 5]);
  const ax = px(.5), ay = py(.5);
  c.beginPath(); c.moveTo(ax, ay); c.lineTo(ax, gy); c.stroke(); c.setLineDash([]);
  c.globalAlpha = .7; c.fillText(L('h máx', 'max h'), ax + 8, (ay + gy) / 2);
  const dy = gy + 26 * u + 8;
  c.globalAlpha = .55; c.beginPath(); c.moveTo(x0, dy); c.lineTo(x1, dy);
  [x0, x1].forEach(x => { c.moveTo(x, dy - 6); c.lineTo(x, dy + 6); }); c.stroke();
  c.globalAlpha = .7; c.textAlign = 'center'; c.fillText('x = v₀ cos θ · t', (x0 + x1) / 2, dy - 6); c.textAlign = 'left';
  // cochinito (salta al ser alcanzado)
  const hit = tc > fly, hop = hit ? Math.max(0, Math.sin(Math.min(1, (tc - fly) / .5) * Math.PI)) * 30 * u + (tc < fly + 2 ? Math.abs(Math.sin((tc - fly) * 9)) * 6 * u * Math.max(0, 1 - (tc - fly) / 2) : 0) : Math.abs(Math.sin(t * 2.2)) * 3 * u;
  const tx = x1, ty = gy - hop, r = 15 * u + 4;
  c.globalAlpha = 1; c.lineWidth = 2.5;
  c.fillStyle = 'rgba(124,196,107,.9)'; c.strokeStyle = '#d7f5cf';
  c.beginPath(); c.ellipse(tx, ty - r * .9, r * 1.1, r * .9, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = '#10213d';
  c.beginPath(); c.arc(tx - r * .38, ty - r * 1.05, r * .16, 0, Math.PI * 2); c.arc(tx + r * .38, ty - r * 1.05, r * .16, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#a7db97'; c.beginPath(); c.ellipse(tx, ty - r * .62, r * .36, r * .24, 0, 0, Math.PI * 2); c.fill();
  if (hit && tc < fly + .7) {           // destello del impacto
    const k = (tc - fly) / .7; c.strokeStyle = gold; c.globalAlpha = 1 - k; c.lineWidth = 2;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r0 = r * (1.3 + k), r1 = r * (1.8 + k * 1.6); c.beginPath(); c.moveTo(tx + Math.cos(a) * r0, ty - r * .9 + Math.sin(a) * r0); c.lineTo(tx + Math.cos(a) * r1, ty - r * .9 + Math.sin(a) * r1); c.stroke(); }
  }

  // vectores que se dibujan (arriba a la derecha)
  const sc = 40 * u + 8, vt = (t % 8) / 8, ox = Math.min(w * .72, w - 3.9 * sc - 30), oy = Math.max(h * .16, 1.9 * sc + 24);
  const vecs = [[1.6, -.9], [1.4, .5], [.7, -1.3]];
  let cx = ox, cy = oy, k = vt * 4.2;
  c.lineWidth = 2.2; c.strokeStyle = line; c.fillStyle = line; c.font = mono(13);
  vecs.forEach((v, i) => {
    const s = clamp(k - i, 0, 1); if (s <= 0) return;
    const ex = cx + v[0] * sc * s, ey = cy + v[1] * sc * s;
    c.globalAlpha = .8; c.beginPath(); c.moveTo(cx, cy); c.lineTo(ex, ey); c.stroke();
    const a = Math.atan2(ey - cy, ex - cx);
    c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex - 9 * Math.cos(a - .4), ey - 9 * Math.sin(a - .4)); c.lineTo(ex - 9 * Math.cos(a + .4), ey - 9 * Math.sin(a + .4)); c.closePath(); c.fill();
    if (s === 1) { c.globalAlpha = .7; c.fillText('V' + '₁₂₃'[i], (cx + ex) / 2 + 6, (cy + ey) / 2 - 6); }
    cx = ex; cy = ey;
  });
  const sR = clamp(k - 3, 0, 1);
  if (sR > 0) {
    const fx = ox + (cx - ox) * sR, fy = oy + (cy - oy) * sR;
    c.strokeStyle = gold; c.fillStyle = gold; c.globalAlpha = .9; c.setLineDash([7, 5]);
    c.beginPath(); c.moveTo(ox, oy); c.lineTo(fx, fy); c.stroke(); c.setLineDash([]);
    if (sR === 1) { c.fillText('R', (ox + cx) / 2 - 4, (oy + cy) / 2 + 18); c.beginPath(); c.arc(cx, cy, 4, 0, Math.PI * 2); c.fill(); }
  }
  c.globalAlpha = .8; c.fillStyle = line; c.beginPath(); c.arc(ox, oy, 4, 0, Math.PI * 2); c.fill();

  // cajetín del plano
  const bw = Math.min(250, w * .42), bh = 46, bx = w - bw - 18, by = h - bh - 18;
  if (w > 520) {
    c.globalAlpha = .5; c.strokeStyle = line; c.lineWidth = 1; c.strokeRect(bx + .5, by + .5, bw, bh);
    c.beginPath(); c.moveTo(bx, by + 22.5); c.lineTo(bx + bw, by + 22.5); c.moveTo(bx + bw * .6 + .5, by + 22); c.lineTo(bx + bw * .6 + .5, by + bh); c.stroke();
    c.fillStyle = C['bp-text']; c.font = "11px 'IBM Plex Mono', monospace"; c.globalAlpha = .65;
    c.fillText('PARÁBOLA BRAVA · g = 9.81 m/s²', bx + 8, by + 15);
    c.fillText(L('SIN AIRE', 'NO DRAG'), bx + 8, by + 38);
    c.fillText(L('HOJA 1/1', 'SHEET 1/1'), bx + bw * .6 + 8, by + 38);
  }
  c.globalAlpha = 1;
}

/* ---------- bucle ---------- */
let lastTs = null;
function frame(ts) {
  const dt = lastTs == null ? 0 : Math.min(0.033, (ts - lastTs) / 1000); lastTs = ts;
  if (VIEW === 'game') {
    S.time += dt;
    if (S.screen === 'play') {
      updateAnim(dt);
      if (S.mode === 'fly') {
        updateProj(dt); tele();
        if (S.proj && S.proj.done && S.proj.doneT > 0.9 && !anyFalling()) endShot();
      }
      if (S.endTimer > 0) { S.endTimer -= dt; if (S.endTimer <= 0) endDespl(); }
      settle(dt); updateParts(dt);
    }
    if (S.online) onlineTick();
    if (S.screen === 'edit' && E.dirty) { E.dirty = false; renderPop(); }
    if (cw > 0) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (S.screen === 'edit') drawEdit(); else drawPlay();
    }
  } else {
    const animate = SET.anim && !reduceMotion;
    if (animate) { bgT += dt; drawBG(bgT); }
    else if (bgDirty) drawBG(31.8);
    bgDirty = false;
  }
  requestAnimationFrame(frame);
}

window.__pbV = () => V; window.__pbPts = () => E.draft && E.draft.mov ? resultant(E.draft.mov).pts : null;
window.__pb = { CAMPAIGN_D, CAMPAIGN_M, solvability, movProblems, resultant, showView, get VIEW() { return VIEW; } };
applyStaticLang();
showView('home');
requestAnimationFrame(frame);
})();
