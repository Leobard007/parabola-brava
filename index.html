<!doctype html>
<!--
  ====================================================================
  PARÁBOLA BRAVA · index.html
  Este archivo contiene solo la ESTRUCTURA de la página (qué elementos existen).
    - El aspecto (colores, tamaños, posiciones) está en la carpeta css/
    - El comportamiento (física, menús, editor, online) está en la carpeta js/
  Lee LEEME.txt para una guía completa del proyecto.

  Tres detalles que verás mucho:
    - id="algo"        → nombre único que usa el JavaScript para encontrar el elemento: $('algo')
    - data-l="es|en"   → texto traducible: el JavaScript pone la parte en español o en inglés
                         según el idioma elegido (por eso muchos elementos parecen vacíos aquí).
    - hidden           → el elemento empieza oculto; el JavaScript lo muestra cuando hace falta.
  ====================================================================
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Parábola Brava</title>

    <!-- Tipografías de Google Fonts: Lilita One (títulos), IBM Plex Sans (texto), IBM Plex Mono (números), Kalam (escritura a mano) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Kalam:wght@400;700&family=Lilita+One&display=swap"
      rel="stylesheet"
    />

    <!-- Hojas de estilo (el orden importa: base.css primero porque define los colores).
     El "?v=N" del final es el número de versión: al cambiarlo, el navegador descarga el archivo nuevo
     en lugar de usar la copia guardada (caché). -->
    <link rel="stylesheet" href="css/base.css?v=9" />
    <link rel="stylesheet" href="css/menus.css?v=9" />
    <link rel="stylesheet" href="css/juego.css?v=9" />
    <link rel="stylesheet" href="css/editor.css?v=9" />
    <link rel="stylesheet" href="css/online.css?v=9" />
  </head>
  <body>
    <!-- Canvas del fondo animado de los menús (lo dibuja js/6-menus/fondo-animado.js) -->
    <canvas id="bg" aria-hidden="true"></canvas>

    <!-- ================================================================
     PANTALLA DE INICIO
     Logo, botones Jugar / Online / Cómo jugar / Configuración.
     Los menús desplegables (onlineMenu, setMenu) empiezan con el atributo "hidden"
     (ocultos) y el JavaScript los muestra al pulsar su botón.
     ================================================================ -->
    <main id="homeScreen" class="menuScreen">
      <h1 class="logo">Parábola <span>Brava</span></h1>
      <p
        class="tagline"
        data-l="Tiro parabólico y vectores de desplazamiento, sin resistencia del aire|Projectile motion and displacement vectors, with no air resistance"
      ></p>
      <div class="menuBtns">
        <button class="mbtn play" id="btnPlay" type="button" data-l="Jugar|Play"></button>
        <div class="settings">
          <button
            class="mbtn online"
            id="btnOnline"
            type="button"
            aria-expanded="false"
            aria-controls="onlineMenu"
          >
            <span data-l="Online|Online"></span
            ><small data-l="Juega con otras personas|Play with other people"></small>
          </button>
          <div class="setmenu onmenu" id="onlineMenu" hidden>
            <button class="onopt" id="btnOnJoin" type="button">
              <b data-l="Unirse a un juego|Join a game"></b
              ><small data-l="Tengo un código de 5 caracteres|I have a 5-character code"></small>
            </button>
            <button class="onopt" id="btnOnCreate" type="button">
              <b data-l="Partida de clase|Class game"></b
              ><small
                data-l="Tú eliges niveles y reglas y ves el progreso de todos|You pick levels and rules and watch everyone’s progress"
              ></small>
            </button>
            <button class="onopt" id="btnOnDuel" type="button">
              <b data-l="Duelo 1 vs 1|1 vs 1 duel"></b
              ><small
                data-l="Carrera o Escondite: tú también juegas|Race or Hide &amp; seek: you play too"
              ></small>
            </button>
          </div>
        </div>
        <button class="mbtn" id="btnHow" type="button" data-l="Cómo jugar|How to play"></button>
        <div class="settings">
          <button
            class="mbtn"
            id="btnSettings"
            type="button"
            aria-expanded="false"
            aria-controls="setMenu"
            data-l="Configuración|Settings"
          ></button>
          <div class="setmenu" id="setMenu" hidden>
            <div class="setrow">
              <span class="setlabel" data-l="Idioma|Language"></span>
              <div class="seg2" role="group" data-la="Idioma|Language">
                <button type="button" data-lang="es">Español</button>
                <button type="button" data-lang="en">English</button>
              </div>
            </div>
            <label class="check"
              ><input type="checkbox" id="setAnim" />
              <span data-l="Animaciones del fondo|Background animations"></span
            ></label>
            <label class="check"
              ><input type="checkbox" id="setSound" /> <span data-l="Efectos de sonido|Sound effects"></span
            ></label>
            <div class="setrow">
              <button
                class="btn danger small"
                id="btnReset"
                type="button"
                data-l="Reiniciar progreso|Reset progress"
              ></button>
              <small
                class="hint"
                id="resetNote"
                data-l="Borra estrellas y niveles desbloqueados. Tus niveles creados se conservan.|Clears stars and unlocked levels. Your own levels are kept."
              ></small>
            </div>
            <div class="verRow">
              <small class="hint" id="verText"></small>
              <button class="btn ghost small" id="btnUpdate" type="button"></button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ================================================================
     MENÚ DE SELECCIÓN
     Las tarjetas de modo (#modeGrid) y la lista de niveles (#levelPanel) están vacías:
     las rellena js/6-menus/menus.js (funciones renderMenus y renderLevelPanel).
     ================================================================ -->
    <main id="selectScreen" class="menuScreen" hidden>
      <div class="selWrap">
        <div class="selHead">
          <button class="mbtn inline" id="btnSelBack" type="button" data-l="← Inicio|← Home"></button>
          <h2 data-l="¿Qué quieres jugar?|What do you want to play?"></h2>
          <button
            class="btn edit"
            id="btnToEditor"
            type="button"
            data-l="Editor de niveles|Level editor"
          ></button>
        </div>
        <div class="modeGrid" id="modeGrid"></div>
        <div class="levelPanel" id="levelPanel"></div>
      </div>
    </main>

    <!-- ================================================================
     PANTALLAS ONLINE
     Todo su contenido se genera desde js/5-online/pantallas-online.js (renderOnline).
     ================================================================ -->
    <main id="onlineScreen" class="menuScreen" hidden>
      <div class="onWrap" id="onBody"></div>
    </main>

    <!-- ================================================================
     PANTALLA DE JUEGO (también contiene el editor)
     - gamebar: barra superior (Menú, nombre, puntos...)
     - stage:   el recuadro con el <canvas id="cv"> donde se dibuja la escena
     - playUI:  paneles del modo juego (datos/respuestas o controles del lanzador)
     - editUI:  paneles del editor de niveles
     ================================================================ -->
    <div id="gameScreen" class="app" hidden>
      <header class="gamebar">
        <div class="left">
          <button class="btn ghost small" id="btnMenu" type="button" data-l="← Menú|← Menu"></button>
          <span class="brandSmall">Parábola <span>Brava</span></span>
          <span class="hint">g = <span id="gLabel">9.81</span> m/s²</span>
          <span class="onChip" id="onChip" hidden></span>
        </div>
        <div class="topRight">
          <button
            id="onBoardBtn"
            class="btn ghost small"
            type="button"
            aria-expanded="false"
            aria-controls="onBoard"
            hidden
            data-l="Tabla de posiciones|Leaderboard"
          ></button>
          <button id="editThis" class="btn ghost small" type="button"></button>
          <button id="editBtn" class="btn edit" type="button"></button>
          <div class="score"><span data-l="Puntos|Score"></span><b id="score">0</b></div>
        </div>
      </header>

      <div class="rivalBar" id="rivalBar" hidden aria-live="polite"></div>
      <div class="onBoard" id="onBoard" hidden></div>
      <div class="stageWrap" id="stageWrap">
        <section class="stage" id="stage">
          <canvas id="cv" data-la="Escena del juego|Game scene"></canvas>
          <div class="hud">
            <span id="hudTag" class="tag"></span><span id="hudPhase" class="phase"></span
            ><span id="hudLevel"></span><span id="hudShots" class="shots"></span><span id="hudTargets"></span>
          </div>
          <div class="overlay" id="overlay" hidden>
            <div class="card">
              <h2 id="ovTitle"></h2>
              <div class="stars" id="ovStars"></div>
              <p id="ovText"></p>
              <div class="ovBtns">
                <button id="ovRetry" class="btn ghost" type="button"></button>
                <button id="ovNext" class="btn" type="button"></button>
              </div>
            </div>
          </div>
        </section>
        <div class="popcard" id="pop" hidden></div>
      </div>

      <!-- ---------- MODO JUEGO: findUI = resolver vectores · shootUI = controles del lanzador ---------- -->
      <div id="playUI" class="stack">
        <section id="findUI" class="panels" hidden>
          <div class="panel find">
            <h3 data-l="Datos conocidos|Known data"></h3>
            <div id="clues" class="clues"></div>
            <div class="btnrow">
              <button
                id="replay"
                class="btn ghost small"
                type="button"
                data-l="Repetir recorrido|Replay the path"
              ></button>
            </div>
          </div>
          <div class="panel find">
            <h3 id="ansTitle"></h3>
            <div id="ansForm" class="stack">
              <div class="fields" id="ansFields"></div>
              <div class="btnrow">
                <button id="ansCheck" class="btn vec" type="button" data-l="Comprobar|Check"></button
                ><small class="hint" id="ansTries"></small>
              </div>
              <div id="ansFb" class="fb" role="status"></div>
            </div>
            <div id="ansSol" class="sol" hidden></div>
          </div>
        </section>

        <div id="shootUI" class="stack">
          <section class="controls">
            <div class="ctl">
              <label for="v0"
                ><span data-l="Velocidad inicial|Initial speed"></span> <i>v₀</i>
                <b class="lock" id="v0Lock" hidden data-l="Fija|Fixed"></b
              ></label>
              <div class="row">
                <input type="range" id="v0" min="5" max="45" step="0.5" value="18" />
                <span class="num"
                  ><input
                    type="number"
                    id="v0n"
                    min="5"
                    max="45"
                    step="0.5"
                    value="18"
                    data-la="v₀ en m/s|v₀ in m/s"
                  /><em>m/s</em></span
                >
              </div>
              <small class="hint" id="v0Hint"></small>
            </div>
            <div class="ctl">
              <label for="ang"
                ><span data-l="Ángulo|Angle"></span> <i>θ</i>
                <b class="lock" id="angLock" hidden data-l="Fijo|Fixed"></b
              ></label>
              <div class="row">
                <input type="range" id="ang" min="-30" max="85" step="1" value="45" />
                <span class="num"
                  ><input
                    type="number"
                    id="angn"
                    min="-30"
                    max="85"
                    step="1"
                    value="45"
                    data-la="θ en grados|θ in degrees"
                  /><em>°</em></span
                >
              </div>
              <small class="hint" id="angHint"></small>
            </div>
            <div class="ctl">
              <label for="h0"
                ><span data-l="Altura de lanzamiento|Launch height"></span> <i>h₀</i>
                <b class="lock" id="h0Lock" hidden data-l="Fija|Fixed"></b
              ></label>
              <div class="row">
                <input type="range" id="h0" min="0" max="15" step="0.5" value="2" />
                <span class="num"
                  ><input
                    type="number"
                    id="h0n"
                    min="0"
                    max="15"
                    step="0.5"
                    value="2"
                    data-la="h₀ en metros|h₀ in meters"
                  /><em>m</em></span
                >
              </div>
              <small class="hint" id="h0Hint"></small>
            </div>
            <div class="ctl">
              <label for="grav"
                ><span data-l="Gravedad|Gravity"></span>
                <b class="lock" id="gLock" hidden data-l="Fija|Fixed"></b
              ></label>
              <select id="grav"></select>
              <label class="check" for="practice"
                ><input type="checkbox" id="practice" />
                <span
                  data-l="Modo práctica (trayectoria completa, sin estrellas)|Practice mode (full path, no stars)"
                ></span
              ></label>
            </div>
            <button id="fire" class="fire" type="button">
              <span data-l="¡Lanzar!|Launch!"></span><small data-l="Enter o espacio|Enter or space"></small>
            </button>
          </section>
          <section class="panels">
            <div class="panel">
              <h3 data-l="Ecuaciones del tiro|Launch equations"></h3>
              <div id="eq" class="eq"></div>
            </div>
            <div class="panel">
              <h3 data-l="Telemetría|Telemetry"></h3>
              <div id="tele" class="tele"></div>
            </div>
          </section>
        </div>
      </div>

      <!-- ---------- MODO EDITOR (lo controla la carpeta js/3-editor/) ---------- -->
      <div id="editUI" class="editor" hidden>
        <div class="tabs" role="tablist" data-la="Tipo de nivel|Level type">
          <button class="tab" id="tabC" role="tab" type="button" aria-selected="true">
            <span data-l="Lanzamiento|Launch"></span
            ><small
              data-l="Derriba los objetivos con el tiro parabólico|Knock down the targets with projectile motion"
            ></small>
          </button>
          <button class="tab d" id="tabD" role="tab" type="button" aria-selected="false">
            <span data-l="Desplazamiento|Displacement"></span
            ><small data-l="Resuelve los vectores del cochinito|Solve the piglet’s vectors"></small>
          </button>
          <button class="tab m" id="tabM" role="tab" type="button" aria-selected="false">
            <span data-l="Mixto|Mixed"></span
            ><small
              data-l="Primero resuelve los vectores, luego lanza|Solve the vectors first, then launch"
            ></small>
          </button>
        </div>

        <div class="toolbar" role="toolbar" data-la="Herramientas del editor|Editor tools">
          <button class="tool" type="button" data-tool="select" aria-pressed="true">
            <i></i><span data-l="Mover|Move"></span>
          </button>
          <button class="tool" type="button" data-tool="start" aria-pressed="false" hidden>
            <i></i><span data-l="Punto A|Point A"></span>
          </button>
          <button class="tool piece" type="button" data-tool="wood" aria-pressed="false">
            <i></i><span data-l="Madera|Wood"></span>
          </button>
          <button class="tool piece" type="button" data-tool="stone" aria-pressed="false">
            <i></i><span data-l="Piedra|Stone"></span>
          </button>
          <button class="tool piece" type="button" data-tool="target" aria-pressed="false">
            <i></i><span data-l="Objetivo|Target"></span>
          </button>
          <button class="tool piece" type="button" data-tool="terrain" aria-pressed="false">
            <i></i><span data-l="Terreno|Terrain"></span>
          </button>
          <button class="tool piece" type="button" data-tool="erase" aria-pressed="false">
            <i></i><span data-l="Borrar|Erase"></span>
          </button>
          <span class="sep" aria-hidden="true"></span>
          <button
            id="ed-undo"
            class="btn ghost small"
            type="button"
            data-l="↶ Deshacer|↶ Undo"
            data-lt="Deshacer (Ctrl+Z)|Undo (Ctrl+Z)"
          ></button>
          <button
            id="ed-redo"
            class="btn ghost small"
            type="button"
            data-l="↷ Rehacer|↷ Redo"
            data-lt="Rehacer (Ctrl+Y)|Redo (Ctrl+Y)"
          ></button>
          <span class="toolHint" id="toolHint"></span>
          <label class="check"
            ><input type="checkbox" id="ed-snap" /> <span data-l="Valores redondos|Round values"></span
          ></label>
          <label class="check"
            ><input type="checkbox" id="ed-gridview" checked />
            <span data-l="Cuadrícula en el editor|Grid in the editor"></span
          ></label>
        </div>

        <div class="panel wide" id="tplPanel">
          <h3 data-l="Plantillas|Templates"></h3>
          <div class="tplgroup" id="tplVec">
            <span
              class="glabel"
              data-l="Vectores · qué debe encontrar el jugador|Vectors · what the player must find"
            ></span>
            <div class="tpls" id="tpl-vec"></div>
          </div>
          <div class="tplgroup" id="tplMix">
            <span
              class="glabel"
              data-l="Mixto · vectores y lanzamiento a la vez|Mixed · vectors and launch together"
            ></span>
            <div class="tpls" id="tpl-mix"></div>
          </div>
          <div class="tplgroup" id="tplPar">
            <span
              class="glabel"
              data-l="Parábola · qué puede ajustar el jugador al lanzar|Parabola · what the player can adjust when launching"
            ></span>
            <div class="tpls" id="tpl-par"></div>
          </div>
          <small
            class="hint"
            data-l="Una plantilla decide qué es dato y qué es incógnita, y añade vectores si hacen falta. Después solo ajustas los valores. Deshacer la revierte.|A template decides what is given and what is unknown, and adds vectors if needed. Then you just adjust the values. Undo reverts it."
          ></small>
        </div>

        <div class="edGrid">
          <div class="panel wide find" id="movPanel" hidden>
            <div class="smartHead">
              <h3 data-l="Variables del problema|Problem variables"></h3>
              <button
                id="mv-add"
                class="btn ghost small"
                type="button"
                data-l="Añadir vector|Add vector"
              ></button>
            </div>
            <div class="status" id="sv-status" role="status"></div>
            <div class="legend">
              <span
                ><b class="ld" data-l="Dato|Given"></b>
                <span data-l="el jugador lo ve|the player sees it"></span></span
              ><span
                ><b class="li">?</b> <span data-l="incógnita que debe encontrar|unknown to find"></span></span
              ><span><b>—</b> <span data-l="oculto|hidden"></span></span
              ><span
                data-l="El botón “?” se apaga cuando con los datos actuales esa variable no se puede calcular.|The “?” button turns off when that variable can’t be worked out from the current data."
              ></span>
            </div>
            <div class="svgrid" id="sv-grid"></div>
            <div class="fields">
              <label class="field"
                ><span data-l="A · x (m)|A · x (m)"></span><input type="number" id="mv-ax" step="0.5"
              /></label>
              <label class="field"
                ><span data-l="A · y (m)|A · y (m)"></span><input type="number" id="mv-ay" step="0.5" min="0"
              /></label>
              <label class="field"
                ><span data-l="Intentos de respuesta|Answer attempts"></span
                ><input type="number" id="mv-tries" min="1" max="6" step="1"
              /></label>
              <label class="field"
                ><span data-l="Tolerancia en valores (%)|Value tolerance (%)"></span
                ><input type="number" id="mv-tolD" min="1" max="25" step="0.5"
              /></label>
              <label class="field"
                ><span data-l="Tolerancia en ángulos (°)|Angle tolerance (°)"></span
                ><input type="number" id="mv-tolA" min="0.5" max="15" step="0.5"
              /></label>
            </div>
            <div class="checks">
              <label class="check"
                ><input type="checkbox" id="mv-path" />
                <span
                  data-l="Mostrar el recorrido del cochinito (flechas de los vectores)|Show the piglet’s path (vector arrows)"
                ></span
              ></label>
              <label class="check"
                ><input type="checkbox" id="mv-hide" />
                <span
                  data-l="Ocultar los números de la escala hasta resolver|Hide the scale numbers until solved"
                ></span
              ></label>
            </div>
            <details class="adv">
              <summary
                data-l="Vista avanzada: tabla de vectores y matriz completa|Advanced view: vector table and full matrix"
              ></summary>
              <div class="stack" style="margin-top: 8px">
                <div class="tablewrap">
                  <table class="vars">
                    <thead>
                      <tr>
                        <th data-l="Vector|Vector"></th>
                        <th data-l="Tipo de magnitud|Quantity type"></th>
                        <th data-l="Valores|Values"></th>
                        <th data-l="Ángulo con la horizontal (°)|Angle from horizontal (°)"></th>
                        <th data-l="Dirección|Direction"></th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody id="mv-vecs"></tbody>
                  </table>
                </div>
                <div class="tablewrap">
                  <table class="vars matrix">
                    <thead>
                      <tr>
                        <th></th>
                        <th>|V| (m)</th>
                        <th>v (m/s)</th>
                        <th>a (m/s²)</th>
                        <th>v₀ (m/s)</th>
                        <th>t (s)</th>
                        <th>θ (°)</th>
                        <th data-l="Dirección|Direction"></th>
                        <th>Δx (m)</th>
                        <th>Δy (m)</th>
                      </tr>
                    </thead>
                    <tbody id="mx-body"></tbody>
                  </table>
                </div>
              </div>
            </details>
          </div>

          <div class="panel">
            <h3 data-l="Nivel|Level"></h3>
            <div class="fields">
              <label class="field full"
                ><span data-l="Nombre|Name"></span><input type="text" id="ed-name" maxlength="40"
              /></label>
              <label class="field"
                ><span data-l="Ancho del mundo (m)|World width (m)"></span
                ><input type="number" id="ed-W" min="20" max="150" step="1"
              /></label>
              <label class="field shootOnly"
                ><span data-l="Tiros|Shots"></span
                ><input type="number" id="ed-shots" min="1" max="10" step="1"
              /></label>
              <label class="field shootOnly"
                ><span data-l="Gravedad|Gravity"></span
                ><select id="ed-g-sel"></select
              ></label>
              <label class="field shootOnly" id="ed-g-wrap"
                ><span>g (m/s²)</span><input type="number" id="ed-g" min="0.1" max="50" step="0.01"
              /></label>
            </div>
            <label class="check shootOnly"
              ><input type="checkbox" id="ed-g-lock" />
              <span data-l="El jugador no puede cambiar la gravedad|The player can’t change gravity"></span
            ></label>
            <label class="check"
              ><input type="checkbox" id="ed-grid" /> <span id="ed-grid-label"></span
            ></label>
            <div class="counts" id="edCounts"></div>
          </div>

          <div class="panel wide shootOnly" id="varsPanel">
            <h3 data-l="Variables del lanzamiento|Launch variables"></h3>
            <div class="tablewrap">
              <table class="vars">
                <thead>
                  <tr>
                    <th data-l="Variable|Variable"></th>
                    <th data-l="Valor inicial|Starting value"></th>
                    <th data-l="Mínimo|Minimum"></th>
                    <th data-l="Máximo|Maximum"></th>
                    <th data-l="Paso|Step"></th>
                    <th data-l="Acceso|Access"></th>
                  </tr>
                </thead>
                <tbody id="edVars"></tbody>
              </table>
            </div>
            <small
              class="hint"
              data-l="Una variable fija no se puede modificar al jugar: el jugador usa siempre su valor inicial. Las demás solo se mueven entre el mínimo y el máximo. También puedes arrastrar la flecha del lanzador y la torre en la escena.|A fixed variable can’t be changed while playing: the player always uses its starting value. The others only move between the minimum and maximum. You can also drag the launcher arrow and the tower in the scene."
            ></small>
          </div>

          <div class="panel">
            <h3 data-l="Probar y guardar|Test and save"></h3>
            <div class="btnrow">
              <button id="ed-test" class="btn edit" type="button" data-l="Probar nivel|Test level"></button>
              <button id="ed-save" class="btn" type="button"></button>
              <button
                id="ed-saveas"
                class="btn ghost"
                type="button"
                data-l="Guardar como nuevo|Save as new"
              ></button>
            </div>
            <div class="btnrow">
              <button
                id="ed-new"
                class="btn ghost small"
                type="button"
                data-l="Nuevo en blanco|New blank level"
              ></button>
              <button
                id="ed-clear"
                class="btn ghost small"
                type="button"
                data-l="Quitar todas las piezas|Remove all pieces"
              ></button>
              <button
                id="ed-del"
                class="btn danger small"
                type="button"
                data-l="Eliminar de mis niveles|Delete from my levels"
              ></button>
            </div>
            <div class="fields">
              <label class="field full"
                ><span data-l="Abrir un nivel existente|Open an existing level"></span
                ><select id="ed-open"></select
              ></label>
              <div class="field">
                <button id="ed-load" class="btn ghost small" type="button" data-l="Abrir|Open"></button>
              </div>
            </div>
            <div class="msg" id="ed-msg" role="status"></div>
          </div>

          <div class="panel">
            <h3 data-l="Compartir con código|Share with a code"></h3>
            <textarea
              id="ed-code"
              data-la="Código del nivel|Level code"
              data-lp="Genera el código de este nivel o pega aquí uno que te hayan pasado.|Generate this level’s code, or paste one someone sent you."
            ></textarea>
            <div class="btnrow">
              <button
                id="ed-export"
                class="btn small"
                type="button"
                data-l="Generar y copiar código|Generate and copy code"
              ></button>
              <button
                id="ed-import"
                class="btn ghost small"
                type="button"
                data-l="Cargar código pegado|Load pasted code"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </div>
