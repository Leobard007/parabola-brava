<!doctype html>
<!--
  ======================================================================
  PARÁBOLA BRAVA · index.html

  This file only contains the STRUCTURE of the page (which elements exist).
    - How things look (colors, sizes, positions) is in the css/ folder.
    - How things behave (physics, menus, editor, online mode) is in the js/ folder.
  Read README.txt for a full guide to the project.

  Things you will see a lot in this file:
    - id="something"     → a unique name. The JavaScript finds the element with
                           getElement('something').
    - class="something"  → a style name. The CSS files say how each class looks.
    - data-text="es|en"  → translatable text. The JavaScript writes the Spanish part
                           or the English part depending on the chosen language
                           (that is why many elements look empty here).
                           data-aria-text, data-title-text and data-placeholder-text
                           do the same for the screen-reader label, the tooltip
                           and the placeholder of a text box.
    - hidden             → the element starts hidden; the JavaScript shows it when needed.
  ======================================================================
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Parábola Brava</title>

    <!-- Fonts from Google Fonts: Lilita One (titles), IBM Plex Sans (text),
         IBM Plex Mono (numbers) and Kalam (hand writing) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Kalam:wght@400;700&family=Lilita+One&display=swap"
      rel="stylesheet"
    />

    <!-- Style sheets. The order matters: base.css goes first because it defines the colors.
         The "?v=10" at the end is the version number: when it changes, browsers download
         the new file instead of using an old saved copy (the "cache"). -->
    <link rel="stylesheet" href="css/base.css?v=10" />
    <link rel="stylesheet" href="css/menus.css?v=10" />
    <link rel="stylesheet" href="css/game.css?v=10" />
    <link rel="stylesheet" href="css/editor.css?v=10" />
    <link rel="stylesheet" href="css/online.css?v=10" />
  </head>
  <body>
    <!-- Canvas behind the menus with the animated blueprint (drawn by js/6-menus/menu-background.js) -->
    <canvas id="menuBackgroundCanvas" aria-hidden="true"></canvas>

    <!-- ================================================================
         HOME SCREEN
         Logo and the buttons Play / Online / How to play / Settings.
         The drop-down menus (onlineMenu and settingsMenu) start hidden and the
         JavaScript shows them when their button is pressed.
         ================================================================ -->
    <main id="homeScreen" class="menu-screen">
      <h1 class="logo">Parábola <span>Brava</span></h1>
      <p
        class="tagline"
        data-text="Tiro parabólico y vectores de desplazamiento, sin resistencia del aire|Projectile motion and displacement vectors, with no air resistance"
      ></p>
      <div class="menu-buttons">
        <button class="menu-button menu-button-play" id="playButton" type="button" data-text="Jugar|Play"></button>

        <!-- Online button and its small menu -->
        <div class="dropdown-wrapper">
          <button class="menu-button menu-button-online" id="onlineButton" type="button" aria-expanded="false" aria-controls="onlineMenu">
            <span data-text="Online|Online"></span><small data-text="Juega con otras personas|Play with other people"></small>
          </button>
          <div class="dropdown-menu online-menu" id="onlineMenu" hidden>
            <button class="online-option" id="onlineJoinButton" type="button">
              <b data-text="Unirse a un juego|Join a game"></b><small data-text="Tengo un código de 5 caracteres|I have a 5-character code"></small>
            </button>
            <button class="online-option" id="onlineClassGameButton" type="button">
              <b data-text="Partida de clase|Class game"></b
              ><small data-text="Tú eliges niveles y reglas y ves el progreso de todos|You pick levels and rules and watch everyone’s progress"></small>
            </button>
            <button class="online-option" id="onlineDuelButton" type="button">
              <b data-text="Duelo 1 vs 1|1 vs 1 duel"></b><small data-text="Carrera o Escondite: tú también juegas|Race or Hide &amp; seek: you play too"></small>
            </button>
          </div>
        </div>

        <button class="menu-button" id="howToPlayButton" type="button" data-text="Cómo jugar|How to play"></button>

        <!-- Settings button and its small menu -->
        <div class="dropdown-wrapper">
          <button class="menu-button" id="settingsButton" type="button" aria-expanded="false" aria-controls="settingsMenu" data-text="Configuración|Settings"></button>
          <div class="dropdown-menu" id="settingsMenu" hidden>
            <div class="settings-row">
              <span class="settings-label" data-text="Idioma|Language"></span>
              <div class="segmented-buttons" role="group" data-aria-text="Idioma|Language">
                <!-- data-language tells the JavaScript which language each button chooses -->
                <button type="button" data-language="es">Español</button>
                <button type="button" data-language="en">English</button>
              </div>
            </div>
            <label class="checkbox-label"><input type="checkbox" id="backgroundAnimationCheckbox" /> <span data-text="Animaciones del fondo|Background animations"></span></label>
            <label class="checkbox-label"><input type="checkbox" id="soundEffectsCheckbox" /> <span data-text="Efectos de sonido|Sound effects"></span></label>
            <div class="settings-row">
              <button class="button button-danger button-small" id="resetProgressButton" type="button" data-text="Reiniciar progreso|Reset progress"></button>
              <small
                class="hint"
                id="resetProgressNote"
                data-text="Borra estrellas y niveles desbloqueados. Tus niveles creados se conservan.|Clears stars and unlocked levels. Your own levels are kept."
              ></small>
            </div>
            <div class="version-row">
              <small class="hint" id="versionText"></small>
              <button class="button button-outline button-small" id="updateButton" type="button"></button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ================================================================
         LEVEL SELECT SCREEN
         The mode cards (#modeCardGrid) and the level list (#levelListPanel) start empty:
         js/6-menus/menus.js fills them (functions renderModeCards and renderLevelList).
         ================================================================ -->
    <main id="levelSelectScreen" class="menu-screen" hidden>
      <div class="level-select-wrapper">
        <div class="level-select-header">
          <button class="menu-button menu-button-inline" id="levelSelectBackButton" type="button" data-text="← Inicio|← Home"></button>
          <h2 data-text="¿Qué quieres jugar?|What do you want to play?"></h2>
          <button class="button button-accent" id="openEditorButton" type="button" data-text="Editor de niveles|Level editor"></button>
        </div>
        <div class="mode-card-grid" id="modeCardGrid"></div>
        <div class="level-list-panel" id="levelListPanel"></div>
      </div>
    </main>

    <!-- ================================================================
         ONLINE SCREENS
         All of their content is created by js/5-online/online-screens.js (renderOnlineScreen).
         ================================================================ -->
    <main id="onlineScreen" class="menu-screen" hidden>
      <div class="online-wrapper" id="onlineScreenContent"></div>
    </main>

    <!-- ================================================================
         GAME SCREEN (it also contains the level editor)
         - top bar:       Menu button, game name, gravity, score
         - stage:         the box with <canvas id="gameCanvas"> where the scene is drawn
         - playControls:  panels used while playing
         - editorPanels:  panels of the level editor
         ================================================================ -->
    <div id="gameScreen" class="game-screen" hidden>
      <header class="game-top-bar">
        <div class="top-bar-left">
          <button class="button button-outline button-small" id="gameMenuButton" type="button" data-text="← Menú|← Menu"></button>
          <span class="brand-small">Parábola <span>Brava</span></span>
          <span class="hint">g = <span id="gravityLabel">9.81</span> m/s²</span>
          <span class="online-status-chip" id="onlineStatusChip" hidden></span>
        </div>
        <div class="top-bar-right">
          <button
            id="leaderboardButton"
            class="button button-outline button-small"
            type="button"
            aria-expanded="false"
            aria-controls="leaderboardPanel"
            hidden
            data-text="Tabla de posiciones|Leaderboard"
          ></button>
          <button id="editThisLevelButton" class="button button-outline button-small" type="button"></button>
          <button id="editorToggleButton" class="button button-accent" type="button"></button>
          <div class="score-box"><span data-text="Puntos|Score"></span><b id="scoreValue">0</b></div>
        </div>
      </header>

      <!-- Only in duels: what the rival is doing right now -->
      <div class="rival-status-bar" id="rivalStatusBar" hidden aria-live="polite"></div>
      <!-- Only online: leaderboard that opens with the "Leaderboard" button -->
      <div class="leaderboard-panel" id="leaderboardPanel" hidden></div>

      <div class="stage-wrapper" id="stageWrapper">
        <section class="stage" id="stage">
          <canvas id="gameCanvas" data-aria-text="Escena del juego|Game scene"></canvas>
          <!-- Small labels in the top-left corner of the scene -->
          <div class="hud">
            <span id="hudModeTag" class="hud-mode-tag"></span><span id="hudPhaseTag" class="hud-phase-tag"></span><span id="hudLevelName"></span
            ><span id="hudShotsLeft" class="hud-shots"></span><span id="hudTargetsLeft"></span>
          </div>
          <!-- Card shown when a level ends -->
          <div class="level-end-overlay" id="levelEndOverlay" hidden>
            <div class="level-end-card">
              <h2 id="levelEndTitle"></h2>
              <div class="stars" id="levelEndStars"></div>
              <p id="levelEndText"></p>
              <div class="level-end-buttons">
                <button id="levelEndRetryButton" class="button button-outline" type="button"></button>
                <button id="levelEndNextButton" class="button" type="button"></button>
              </div>
            </div>
          </div>
        </section>
        <!-- Editor only: floating card with the properties of the selected thing -->
        <div class="property-card" id="editorPropertyCard" hidden></div>
      </div>

      <!-- ---------- PLAY MODE ---------- -->
      <div id="playControls" class="stack">
        <!-- Vector levels: known data and answer boxes -->
        <section id="vectorPuzzlePanels" class="panel-grid" hidden>
          <div class="panel panel-vector">
            <h3 data-text="Datos conocidos|Known data"></h3>
            <div id="knownDataList" class="known-data"></div>
            <div class="button-row">
              <button id="replayPathButton" class="button button-outline button-small" type="button" data-text="Repetir recorrido|Replay the path"></button>
            </div>
          </div>
          <div class="panel panel-vector">
            <h3 id="answerTitle"></h3>
            <div id="answerForm" class="stack">
              <div class="form-fields" id="answerFields"></div>
              <div class="button-row">
                <button id="checkAnswerButton" class="button button-vector" type="button" data-text="Comprobar|Check"></button><small class="hint" id="attemptsInfo"></small>
              </div>
              <div id="answerFeedback" class="answer-feedback" role="status"></div>
            </div>
            <div id="solutionPanel" class="solution" hidden></div>
          </div>
        </section>

        <!-- Launch levels: the launcher controls, equations and telemetry -->
        <div id="launchControls" class="stack">
          <section class="launch-controls">
            <div class="control-box">
              <label for="launchSpeedSlider"
                ><span data-text="Velocidad inicial|Initial speed"></span> <i>v₀</i>
                <b class="lock-badge" id="launchSpeedLockBadge" hidden data-text="Fija|Fixed"></b
              ></label>
              <div class="control-row">
                <input type="range" id="launchSpeedSlider" min="5" max="45" step="0.5" value="18" />
                <span class="number-with-unit"
                  ><input type="number" id="launchSpeedInput" min="5" max="45" step="0.5" value="18" data-aria-text="v₀ en m/s|v₀ in m/s" /><em>m/s</em></span
                >
              </div>
              <small class="hint" id="launchSpeedHint"></small>
            </div>
            <div class="control-box">
              <label for="launchAngleSlider"
                ><span data-text="Ángulo|Angle"></span> <i>θ</i> <b class="lock-badge" id="launchAngleLockBadge" hidden data-text="Fijo|Fixed"></b
              ></label>
              <div class="control-row">
                <input type="range" id="launchAngleSlider" min="-30" max="85" step="1" value="45" />
                <span class="number-with-unit"
                  ><input type="number" id="launchAngleInput" min="-30" max="85" step="1" value="45" data-aria-text="θ en grados|θ in degrees" /><em>°</em></span
                >
              </div>
              <small class="hint" id="launchAngleHint"></small>
            </div>
            <div class="control-box">
              <label for="launchHeightSlider"
                ><span data-text="Altura de lanzamiento|Launch height"></span> <i>h₀</i>
                <b class="lock-badge" id="launchHeightLockBadge" hidden data-text="Fija|Fixed"></b
              ></label>
              <div class="control-row">
                <input type="range" id="launchHeightSlider" min="0" max="15" step="0.5" value="2" />
                <span class="number-with-unit"
                  ><input type="number" id="launchHeightInput" min="0" max="15" step="0.5" value="2" data-aria-text="h₀ en metros|h₀ in meters" /><em>m</em></span
                >
              </div>
              <small class="hint" id="launchHeightHint"></small>
            </div>
            <div class="control-box">
              <label for="gravitySelect"><span data-text="Gravedad|Gravity"></span> <b class="lock-badge" id="gravityLockBadge" hidden data-text="Fija|Fixed"></b></label>
              <select id="gravitySelect"></select>
              <label class="checkbox-label" for="practiceModeCheckbox"
                ><input type="checkbox" id="practiceModeCheckbox" />
                <span data-text="Modo práctica (trayectoria completa, sin estrellas)|Practice mode (full path, no stars)"></span
              ></label>
            </div>
            <button id="launchButton" class="launch-button" type="button">
              <span data-text="¡Lanzar!|Launch!"></span><small data-text="Enter o espacio|Enter or space"></small>
            </button>
          </section>
          <section class="panel-grid">
            <div class="panel">
              <h3 data-text="Ecuaciones del tiro|Launch equations"></h3>
              <div id="launchEquations" class="launch-equations"></div>
            </div>
            <div class="panel">
              <h3 data-text="Telemetría|Telemetry"></h3>
              <div id="telemetry" class="telemetry"></div>
            </div>
          </section>
        </div>
      </div>

      <!-- ---------- EDITOR MODE (controlled by the js/3-editor/ folder) ---------- -->
      <div id="editorPanels" class="editor" hidden>
        <!-- Level type tabs -->
        <div class="editor-tabs" role="tablist" data-aria-text="Tipo de nivel|Level type">
          <button class="editor-tab" id="editorLaunchTab" role="tab" type="button" aria-selected="true">
            <span data-text="Lanzamiento|Launch"></span><small data-text="Derriba los objetivos con el tiro parabólico|Knock down the targets with projectile motion"></small>
          </button>
          <button class="editor-tab editor-tab-displacement" id="editorDisplacementTab" role="tab" type="button" aria-selected="false">
            <span data-text="Desplazamiento|Displacement"></span><small data-text="Resuelve los vectores del cochinito|Solve the piglet’s vectors"></small>
          </button>
          <button class="editor-tab editor-tab-mixed" id="editorMixedTab" role="tab" type="button" aria-selected="false">
            <span data-text="Mixto|Mixed"></span><small data-text="Primero resuelve los vectores, luego lanza|Solve the vectors first, then launch"></small>
          </button>
        </div>

        <!-- Tool bar. data-tool says which tool each button selects -->
        <div class="editor-toolbar" role="toolbar" data-aria-text="Herramientas del editor|Editor tools">
          <button class="editor-tool" type="button" data-tool="select" aria-pressed="true"><i></i><span data-text="Mover|Move"></span></button>
          <button class="editor-tool" type="button" data-tool="start" aria-pressed="false" hidden><i></i><span data-text="Punto A|Point A"></span></button>
          <button class="editor-tool editor-tool-piece" type="button" data-tool="wood" aria-pressed="false"><i></i><span data-text="Madera|Wood"></span></button>
          <button class="editor-tool editor-tool-piece" type="button" data-tool="stone" aria-pressed="false"><i></i><span data-text="Piedra|Stone"></span></button>
          <button class="editor-tool editor-tool-piece" type="button" data-tool="target" aria-pressed="false"><i></i><span data-text="Objetivo|Target"></span></button>
          <button class="editor-tool editor-tool-piece" type="button" data-tool="terrain" aria-pressed="false"><i></i><span data-text="Terreno|Terrain"></span></button>
          <button class="editor-tool editor-tool-piece" type="button" data-tool="erase" aria-pressed="false"><i></i><span data-text="Borrar|Erase"></span></button>
          <span class="toolbar-separator" aria-hidden="true"></span>
          <button id="editorUndoButton" class="button button-outline button-small" type="button" data-text="↶ Deshacer|↶ Undo" data-title-text="Deshacer (Ctrl+Z)|Undo (Ctrl+Z)"></button>
          <button id="editorRedoButton" class="button button-outline button-small" type="button" data-text="↷ Rehacer|↷ Redo" data-title-text="Rehacer (Ctrl+Y)|Redo (Ctrl+Y)"></button>
          <span class="editor-tool-hint" id="editorToolHint"></span>
          <label class="checkbox-label"><input type="checkbox" id="roundValuesCheckbox" /> <span data-text="Valores redondos|Round values"></span></label>
          <label class="checkbox-label"><input type="checkbox" id="editorGridCheckbox" checked /> <span data-text="Cuadrícula en el editor|Grid in the editor"></span></label>
        </div>

        <!-- Templates (the buttons are created by js/3-editor/editor-templates.js) -->
        <div class="panel panel-wide" id="templatesPanel">
          <h3 data-text="Plantillas|Templates"></h3>
          <div class="template-group" id="vectorTemplatesGroup">
            <span class="template-group-label" data-text="Vectores · qué debe encontrar el jugador|Vectors · what the player must find"></span>
            <div class="template-buttons" id="vectorTemplateButtons"></div>
          </div>
          <div class="template-group" id="mixedTemplatesGroup">
            <span class="template-group-label" data-text="Mixto · vectores y lanzamiento a la vez|Mixed · vectors and launch together"></span>
            <div class="template-buttons" id="mixedTemplateButtons"></div>
          </div>
          <div class="template-group" id="launchTemplatesGroup">
            <span class="template-group-label" data-text="Parábola · qué puede ajustar el jugador al lanzar|Parabola · what the player can adjust when launching"></span>
            <div class="template-buttons" id="launchTemplateButtons"></div>
          </div>
          <small
            class="hint"
            data-text="Una plantilla decide qué es dato y qué es incógnita, y añade vectores si hacen falta. Después solo ajustas los valores. Deshacer la revierte.|A template decides what is given and what is unknown, and adds vectors if needed. Then you just adjust the values. Undo reverts it."
          ></small>
        </div>

        <div class="editor-grid">
          <!-- "Problem variables" panel (only for vector levels) -->
          <div class="panel panel-wide panel-vector" id="puzzleVariablesPanel" hidden>
            <div class="panel-header">
              <h3 data-text="Variables del problema|Problem variables"></h3>
              <button id="addVectorButton" class="button button-outline button-small" type="button" data-text="Añadir vector|Add vector"></button>
            </div>
            <div class="puzzle-status" id="puzzleStatus" role="status"></div>
            <div class="legend">
              <span><b class="legend-given" data-text="Dato|Given"></b> <span data-text="el jugador lo ve|the player sees it"></span></span>
              <span><b class="legend-unknown">?</b> <span data-text="incógnita que debe encontrar|unknown to find"></span></span>
              <span><b>—</b> <span data-text="oculto|hidden"></span></span>
              <span
                data-text="El botón “?” se apaga cuando con los datos actuales esa variable no se puede calcular.|The “?” button turns off when that variable can’t be worked out from the current data."
              ></span>
            </div>
            <div class="variable-card-grid" id="puzzleVariableCards"></div>
            <div class="form-fields">
              <label class="form-field"><span data-text="A · x (m)|A · x (m)"></span><input type="number" id="startPointXInput" step="0.5" /></label>
              <label class="form-field"><span data-text="A · y (m)|A · y (m)"></span><input type="number" id="startPointYInput" step="0.5" min="0" /></label>
              <label class="form-field"><span data-text="Intentos de respuesta|Answer attempts"></span><input type="number" id="answerAttemptsInput" min="1" max="6" step="1" /></label>
              <label class="form-field"><span data-text="Tolerancia en valores (%)|Value tolerance (%)"></span><input type="number" id="valueToleranceInput" min="1" max="25" step="0.5" /></label>
              <label class="form-field"><span data-text="Tolerancia en ángulos (°)|Angle tolerance (°)"></span><input type="number" id="angleToleranceInput" min="0.5" max="15" step="0.5" /></label>
            </div>
            <div class="checkbox-row">
              <label class="checkbox-label"
                ><input type="checkbox" id="showPathCheckbox" />
                <span data-text="Mostrar el recorrido del cochinito (flechas de los vectores)|Show the piglet’s path (vector arrows)"></span
              ></label>
              <label class="checkbox-label"
                ><input type="checkbox" id="hideScaleCheckbox" /> <span data-text="Ocultar los números de la escala hasta resolver|Hide the scale numbers until solved"></span
              ></label>
            </div>
            <details class="advanced-details">
              <summary data-text="Vista avanzada: tabla de vectores y matriz completa|Advanced view: vector table and full matrix"></summary>
              <div class="stack" style="margin-top: 8px">
                <div class="table-wrapper">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th data-text="Vector|Vector"></th>
                        <th data-text="Tipo de magnitud|Quantity type"></th>
                        <th data-text="Valores|Values"></th>
                        <th data-text="Ángulo con la horizontal (°)|Angle from horizontal (°)"></th>
                        <th data-text="Dirección|Direction"></th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody id="advancedVectorTableBody"></tbody>
                  </table>
                </div>
                <div class="table-wrapper">
                  <table class="data-table matrix-table">
                    <thead>
                      <tr>
                        <th></th>
                        <th>|V| (m)</th>
                        <th>v (m/s)</th>
                        <th>a (m/s²)</th>
                        <th>v₀ (m/s)</th>
                        <th>t (s)</th>
                        <th>θ (°)</th>
                        <th data-text="Dirección|Direction"></th>
                        <th>Δx (m)</th>
                        <th>Δy (m)</th>
                      </tr>
                    </thead>
                    <tbody id="visibilityMatrixBody"></tbody>
                  </table>
                </div>
              </div>
            </details>
          </div>

          <!-- General level settings -->
          <div class="panel">
            <h3 data-text="Nivel|Level"></h3>
            <div class="form-fields">
              <label class="form-field form-field-full"><span data-text="Nombre|Name"></span><input type="text" id="levelNameInput" maxlength="40" /></label>
              <label class="form-field"><span data-text="Ancho del mundo (m)|World width (m)"></span><input type="number" id="worldWidthInput" min="20" max="150" step="1" /></label>
              <label class="form-field launch-only"><span data-text="Tiros|Shots"></span><input type="number" id="shotCountInput" min="1" max="10" step="1" /></label>
              <label class="form-field launch-only"><span data-text="Gravedad|Gravity"></span><select id="editorGravitySelect"></select></label>
              <label class="form-field launch-only" id="customGravityField"><span>g (m/s²)</span><input type="number" id="customGravityInput" min="0.1" max="50" step="0.01" /></label>
            </div>
            <label class="checkbox-label launch-only"
              ><input type="checkbox" id="gravityLockedCheckbox" /> <span data-text="El jugador no puede cambiar la gravedad|The player can’t change gravity"></span
            ></label>
            <label class="checkbox-label"><input type="checkbox" id="playerSeesGridCheckbox" /> <span id="playerSeesGridLabel"></span></label>
            <div class="piece-counts" id="pieceCounts"></div>
          </div>

          <!-- Launch variables table (starting value, minimum, maximum, step, fixed) -->
          <div class="panel panel-wide launch-only" id="launchVariablesPanel">
            <h3 data-text="Variables del lanzamiento|Launch variables"></h3>
            <div class="table-wrapper">
              <table class="data-table">
                <thead>
                  <tr>
                    <th data-text="Variable|Variable"></th>
                    <th data-text="Valor inicial|Starting value"></th>
                    <th data-text="Mínimo|Minimum"></th>
                    <th data-text="Máximo|Maximum"></th>
                    <th data-text="Paso|Step"></th>
                    <th data-text="Acceso|Access"></th>
                  </tr>
                </thead>
                <tbody id="launchVariablesTableBody"></tbody>
              </table>
            </div>
            <small
              class="hint"
              data-text="Una variable fija no se puede modificar al jugar: el jugador usa siempre su valor inicial. Las demás solo se mueven entre el mínimo y el máximo. También puedes arrastrar la flecha del lanzador y la torre en la escena.|A fixed variable can’t be changed while playing: the player always uses its starting value. The others only move between the minimum and maximum. You can also drag the launcher arrow and the tower in the scene."
            ></small>
          </div>

          <!-- Test, save and open -->
          <div class="panel">
            <h3 data-text="Probar y guardar|Test and save"></h3>
            <div class="button-row">
              <button id="testLevelButton" class="button button-accent" type="button" data-text="Probar nivel|Test level"></button>
              <button id="saveLevelButton" class="button" type="button"></button>
              <button id="saveAsNewButton" class="button button-outline" type="button" data-text="Guardar como nuevo|Save as new"></button>
            </div>
            <div class="button-row">
              <button id="newBlankLevelButton" class="button button-outline button-small" type="button" data-text="Nuevo en blanco|New blank level"></button>
              <button id="removeAllPiecesButton" class="button button-outline button-small" type="button" data-text="Quitar todas las piezas|Remove all pieces"></button>
              <button id="deleteLevelButton" class="button button-danger button-small" type="button" data-text="Eliminar de mis niveles|Delete from my levels"></button>
            </div>
            <div class="form-fields">
              <label class="form-field form-field-full"><span data-text="Abrir un nivel existente|Open an existing level"></span><select id="openLevelSelect"></select></label>
              <div class="form-field"><button id="openLevelButton" class="button button-outline button-small" type="button" data-text="Abrir|Open"></button></div>
            </div>
            <div class="editor-message" id="editorMessage" role="status"></div>
          </div>

          <!-- Share with a code -->
          <div class="panel">
            <h3 data-text="Compartir con código|Share with a code"></h3>
            <textarea
              id="levelCodeBox"
              data-aria-text="Código del nivel|Level code"
              data-placeholder-text="Genera el código de este nivel o pega aquí uno que te hayan pasado.|Generate this level’s code, or paste one someone sent you."
            ></textarea>
            <div class="button-row">
              <button id="exportCodeButton" class="button button-small" type="button" data-text="Generar y copiar código|Generate and copy code"></button>
              <button id="importCodeButton" class="button button-outline button-small" type="button" data-text="Cargar código pegado|Load pasted code"></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================================================================
         POP-UP WINDOWS: "How to play" guide, player details (online),
         countdown and notices. They all start hidden.
         ================================================================ -->
    <div class="modal" id="howToPlayWindow" hidden role="dialog" aria-modal="true" aria-labelledby="howToPlayTitle">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="howToPlayTitle" data-text="Cómo jugar|How to play"></h2>
          <button class="close-button" id="howToPlayCloseButton" type="button" data-aria-text="Cerrar|Close">×</button>
        </div>
        <div class="how-to-play-picture" id="howToPlayPicture"></div>
        <div class="how-to-play-step" id="howToPlayStepText"></div>
        <div class="modal-footer">
          <button class="button button-outline button-small" id="howToPlayBackButton" type="button" data-text="← Anterior|← Back"></button>
          <div class="step-dots" id="howToPlayDots"></div>
          <button class="button button-small" id="howToPlayNextButton" type="button"></button>
        </div>
      </div>
    </div>

    <div class="modal" id="playerDetailWindow" hidden role="dialog" aria-modal="true" aria-labelledby="playerDetailTitle">
      <div class="modal-card modal-card-wide" id="playerDetailCard"></div>
    </div>
    <div class="countdown-overlay" id="countdownOverlay" hidden aria-live="assertive"><span id="countdownNumber"></span></div>
    <div class="toast-area" id="toastArea" aria-live="polite"></div>
